name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # One job covers Go race tests, golangci-lint, govulncheck and the
    # TypeScript workspace; 15 minutes cut it too close.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: idenqa
          POSTGRES_PASSWORD: idenqa_dev
          POSTGRES_USER: idenqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idenqa -d idenqa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.1
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.22.3

      - name: Enable Corepack
        run: corepack enable

      - name: Install TypeScript workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Install evaluation ONNX runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/idenqa-onnx"
          "$RUNNER_TEMP/idenqa-onnx/bin/python" -m pip install --require-hashes --only-binary=:all: -r adapters/models/onnx/requirements.lock
          echo "ONNX_TEST_PYTHON=$RUNNER_TEMP/idenqa-onnx/bin/python" >> "$GITHUB_ENV"

      - name: Verify native face preparation
        run: '"$ONNX_TEST_PYTHON" -B -m unittest discover -s adapters/models/onnx -p "*_test.py"'

      - name: Verify repository
        run: make verify

      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          make contract-breaking OPENAPI_BASE="${BASE_SHA}:contracts/api/openapi/v1/openapi.yaml"
          make proto-breaking PROTO_BASE=".git#ref=${BASE_SHA}"

      # The CLI and API binaries read their default dotenv file and fail closed
      # when it is absent; provide an empty file, as the runtime image does.
      - name: Provide empty dotenv for CLI commands
        run: touch .env

      - name: Apply embedded migrations
        env:
          IDENQA_DATABASE_URL: postgres://idenqa:idenqa_dev@127.0.0.1:5432/idenqa?sslmode=disable
        run: make migrate

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_TEST_URL: postgres://idenqa:idenqa_dev@127.0.0.1:5432/idenqa?sslmode=disable
        run: make integration

      - name: Run TypeScript SDK conformance
        env:
          DATABASE_TEST_URL: postgres://idenqa:idenqa_dev@127.0.0.1:5432/idenqa?sslmode=disable
        run: make sdk-conformance

  # Visual snapshots are rendered by the exact Chromium build and font set of
  # this pinned image. Keep the tag in sync with @playwright/test in
  # capture/web/package.json: the ubuntu-latest image resolves different fonts
  # and would produce spurious snapshot failures.
  capture-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install TypeScript workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Run capture browser suite
        run: corepack pnpm --filter @idenqa/capture test:browser
