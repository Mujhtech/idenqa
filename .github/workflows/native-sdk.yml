name: Native SDKs

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/swift
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift --version
      - run: swift test

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/kotlin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            sdk/kotlin/*.gradle.kts
            sdk/kotlin/gradle/wrapper/gradle-wrapper.properties
            sdk/kotlin/idenqa/*.gradle.kts
      - run: ./gradlew :idenqa:test --no-daemon
