version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /adapters/objectstore/s3
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /distributions/s3
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /sdk/kotlin
    schedule:
      interval: weekly
    ignore:
      # AGP's built-in Kotlin compiler is 2.2.0 and reads metadata up to 2.3.0.
      # Keep the test stack on 2.3.x until the Android toolchain supports 2.4.
      - dependency-name: "org.jetbrains.kotlin:kotlin-test-junit"
        versions: [">= 2.4.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
