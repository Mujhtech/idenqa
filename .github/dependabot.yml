version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /adapters/objectstore/s3
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /distributions/s3
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-host-fixtures:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # openapi-typescript 7.13.0 requires TypeScript 5.x and uses its compiler API.
      # Revisit together with generator support; keep 5.x security patches enabled.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: /sdk/kotlin
    schedule:
      interval: weekly
    ignore:
      # Keep the JUnit adapter at its separately selected 2.3.x version.
      # Stdlib and kotlin-test upgrades are managed independently.
      - dependency-name: "org.jetbrains.kotlin:kotlin-test-junit"
        versions: [">= 2.4.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
