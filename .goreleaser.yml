version: 2

project_name: idenqa

before:
  hooks:
    - go mod verify

builds:
  - id: api
    main: ./cmd/api
    binary: api
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Mujhtech/idenqa/internal/buildinfo.version={{.Version}} -X github.com/Mujhtech/idenqa/internal/buildinfo.commit={{.Commit}} -X github.com/Mujhtech/idenqa/internal/buildinfo.date={{.Date}}
  - id: worker
    main: ./cmd/worker
    binary: worker
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Mujhtech/idenqa/internal/buildinfo.version={{.Version}} -X github.com/Mujhtech/idenqa/internal/buildinfo.commit={{.Commit}} -X github.com/Mujhtech/idenqa/internal/buildinfo.date={{.Date}}
  - id: idenqa
    main: ./cmd/idenqa
    binary: idenqa
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Mujhtech/idenqa/internal/buildinfo.version={{.Version}} -X github.com/Mujhtech/idenqa/internal/buildinfo.commit={{.Commit}} -X github.com/Mujhtech/idenqa/internal/buildinfo.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/runbooks/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
