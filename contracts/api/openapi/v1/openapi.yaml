        decision_id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        policy_id:
          $ref: "#/components/schemas/PolicyID"
        region:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
          example: ng-1
        policy_revision:
          type: integer
          minimum: 1
          maximum: 4294967295
        policy_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluator_major:
          type: integer
          minimum: 1
          maximum: 65535
        evaluator_minor:
          type: integer
          minimum: 0
          maximum: 65535
        evaluator_digest:
          $ref: "#/components/schemas/PolicyDigest"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_digest:
          $ref: "#/components/schemas/PolicyDigest"
        bundle_digest:
          $ref: "#/components/schemas/PolicyDigest"
        directive:
          $ref: "#/components/schemas/PolicyDirective"
        outcome:
          $ref: "#/components/schemas/PolicyOutcome"
        assurance:
          type: string
          maxLength: 128
          pattern: ^$|^[a-z][a-z0-9._:-]*$
        actor:
          $ref: "#/components/schemas/PolicyActor"
        supersedes:
          $ref: "#/components/schemas/PolicyDecisionID"
        fact_count:
          type: integer
          minimum: 1
          maximum: 128
        requirement_count:
          type: integer
          minimum: 1
          maximum: 128
        evaluated_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        reproduced:
          type: boolean
          const: true
    PolicyDecisionBundle:
      type: object
      description: Byte-canonical, self-checking decision reproduction envelope; it never contains raw evidence bytes.
      additionalProperties: false
      required:
        - schema_major
        - schema_minor
        - bundle_digest
        - decision_id
        - tenant_id
        - verification_id
        - snapshot_digest
        - evaluation_digest
        - decision_digest
        - snapshot
        - evaluation
        - decision
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        bundle_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_digest:
          $ref: "#/components/schemas/PolicyDigest"
        snapshot:
          $ref: "#/components/schemas/PolicyCanonicalSnapshot"
        evaluation:
          $ref: "#/components/schemas/PolicyCanonicalEvaluation"
        decision:
          $ref: "#/components/schemas/PolicyCanonicalDecision"
    PolicyCanonicalSnapshot:
      type: object
      description: Exact canonical facts and pinned policy and evaluator inputs.
      additionalProperties: false
      required:
        [
          schema_major,
          schema_minor,
          tenant_id,
          verification_id,
          authority_id,
          acknowledgement_id,
          region,
          policy,
          evaluator,
          evaluated_at,
          facts,
        ]
      properties:
        context:
          $ref: "#/components/schemas/DecisionContext"
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        authority_id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        acknowledgement_id:
          $ref: "#/components/schemas/SubjectResponseID"
        region:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9._:-]*$
        policy:
          $ref: "#/components/schemas/PolicyCanonicalReference"
        evaluator:
          $ref: "#/components/schemas/PolicyCanonicalEvaluator"
        evaluated_at:
