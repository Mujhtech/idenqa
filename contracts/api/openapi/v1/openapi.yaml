        type: { $ref: '#/components/schemas/PrivacyRequestType' }
        subject_id: { type: string, minLength: 1, maxLength: 200, example: sub_01M11HEQG00000000000000000 }
        region: { type: string, minLength: 1, maxLength: 63, example: ng-1 }
        purpose: { type: string, minLength: 1, maxLength: 128, example: liveness-check }
        record_id: { type: string, minLength: 1, maxLength: 64, example: obs_01M11HEQG00000000000000000 }
