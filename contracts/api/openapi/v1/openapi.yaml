        category:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.authority.customer_declared
        purpose:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
