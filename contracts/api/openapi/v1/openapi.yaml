        package_digest:
          $ref: "#/components/schemas/PolicyDigest"
        observation: *id001
        risk_outcome:
          type: string
          enum:
            - satisfied
            - not_satisfied
            - disagreement
        group: *id001
    FraudConfiguration:
      type: object
