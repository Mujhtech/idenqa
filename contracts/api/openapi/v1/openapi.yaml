              kind:
                $ref: "#/components/schemas/FraudTokenKind"
              value:
                type: string
                minLength: 1
                maxLength: 2048
          maxItems: 16
          minItems: 1
          example:
            - kind: device
              value: token-1
    FraudProposal:
      type: object
      description: Non-authoritative fraud hypothesis bound to an immutable receipt digest.
      example:
        receipt_digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        hypothesis: device.reuse.requires.review
        signals: [device_reuse]
      additionalProperties: false
      required:
        - receipt_digest
        - hypothesis
        - signals
      properties:
        receipt_digest:
          $ref: "#/components/schemas/PolicyDigest"
        hypothesis: *id001
        signals:
          type: array
          items:
            $ref: "#/components/schemas/FraudSignal"
          maxItems: 12
          minItems: 1
          uniqueItems: true
          example: [device_reuse]
    FraudFinding:
      type: object
      description: Bounded per-signal outcome with its safe reason code.
      example:
        signal: device_reuse
        state: satisfied
        count: 1
        reason: risk.satisfied
      additionalProperties: false
      required:
        - signal
        - state
        - count
        - reason
      properties:
        signal:
          $ref: "#/components/schemas/FraudSignal"
        state:
          type: string
          enum:
            - satisfied
            - not_satisfied
            - inconclusive
        count:
          type: integer
          minimum: 0
          maximum: 10000
        reason: *id001
    FraudReceipt:
      type: object
      description: Immutable reference-only evaluation receipt with its findings.
      example:
        digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        verification_id: ver_01M11HEQG00000000000000000
        configuration_version: 1
        configuration_digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        at: '2026-09-10T12:00:00Z'
        findings: []
      additionalProperties: false
      required:
        - digest
        - verification_id
        - configuration_version
        - configuration_digest
        - at
        - findings
      properties:
        digest:
          $ref: "#/components/schemas/PolicyDigest"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        configuration_version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        configuration_digest:
          $ref: "#/components/schemas/PolicyDigest"
        at:
          type: string
          format: date-time
        findings:
          type: array
          items:
            $ref: "#/components/schemas/FraudFinding"
          maxItems: 12
    FraudResult:
      type: object
      description: Safe fraud projection containing at most one configuration, receipt or proposal.
      example:
        version: 1
      additionalProperties: false
      required: []
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          example: 1
        digest:
          $ref: "#/components/schemas/PolicyDigest"
        configuration:
          $ref: "#/components/schemas/FraudConfiguration"
        receipt:
          $ref: "#/components/schemas/FraudReceipt"
        proposal:
          $ref: "#/components/schemas/FraudProposal"

    IdentitySubjectID:
      type: string
      description: Opaque tenant-persistent subject identifier.
      maxLength: 30
      pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
      example: sub_01M11HEQG00000000000000000
    IdentityRecordID:
      type: string
      description: Opaque immutable observation, fact, claim or identifier record identifier.
      maxLength: 30
      pattern: ^(obs|fct|clm|idi)_[0-9A-HJKMNP-TV-Z]{26}$
      example: obs_01M11HEQG00000000000000000
    IdentityValue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - string
            - boolean
            - integer
            - decimal
            - date
            - timestamp
        value:
          type: string
          maxLength: 4096
          minLength: 1
      required:
        - type
        - value
      description: A sensitive typed scalar. Numeric values are canonical decimal
        strings to preserve precision; dates use YYYY-MM-DD and timestamps use UTC
        RFC3339. Values are encrypted in storage and revealed only with identity:reveal.
    IdentitySubject:
      type: object
      description: Persistent tenant subject metadata without identity values.
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/IdentitySubjectID"
        region:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
            - active
            - suspended
            - deleting
            - deleted
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        external_reference:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        deletion_id:
          type: string
          maxLength: 30
          pattern: ^del_[0-9A-HJKMNP-TV-Z]{26}$
        erased_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - id
        - region
        - state
        - version
        - created_at
        - updated_at
    IdentityIdentifierInput:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        issuer:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        verification_state:
          type: string
          enum:
            - unverified
            - verified
            - not_verified
            - inconclusive
      required:
        - namespace
        - issuer
        - verification_state
      description: The verification state is a tenant attestation, attributed to the
        submitting key. It is not a Core verification decision and is not consumed
        as a trusted policy fact.
    IdentityIdentifier:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        issuer:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        verification_state:
          type: string
          enum:
            - unverified
            - verified
            - not_verified
            - inconclusive
        verification_state_source:
          type: string
          const: tenant_attested
        verification_actor_id:
          type: string
          maxLength: 30
          pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
        masked:
          type: string
          maxLength: 32
      required:
        - namespace
        - issuer
        - verification_state
        - verification_state_source
        - verification_actor_id
      description: The verification state is a tenant attestation, attributed to the
        submitting key. It is not a Core verification decision and is not consumed
        as a trusted policy fact.
    IdentityRecordInput:
      type: object
      example:
        kind: fact
        name: name.full
        verification_id: ver_01M11HEQG00000000000000000
        normalization: identity.exact.v1
        collected_at: '2026-09-10T12:00:00Z'
        observed_at: '2026-09-10T12:00:00Z'
        valid_from: '2026-09-10T12:00:00Z'
        valid_until: '2026-09-11T12:00:00Z'
        retain_until: '2026-09-11T12:00:00Z'
        source_record_ids: [obs_01M11HEQG00000000000000000]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - observation
            - fact
            - claim
            - identifier
          example: observation
        name:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        evidence_ids:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/EvidenceID"
          uniqueItems: true
        source_record_ids:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/IdentityRecordID"
          uniqueItems: true
        origin_observation_id:
          $ref: "#/components/schemas/PolicyObservationID"
        source_name:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        input_version:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        normalization:
          type: string
          enum:
            - identity.exact.v1
            - identity.trim.v1
            - identity.ascii_upper.v1
        value:
          $ref: "#/components/schemas/IdentityValue"
        original:
          $ref: "#/components/schemas/IdentityValue"
        supersedes:
          $ref: "#/components/schemas/IdentityRecordID"
        collected_at:
          type: string
          format: date-time
          pattern: Z$
        observed_at:
          type: string
          format: date-time
          pattern: Z$
        valid_from:
          type: string
          format: date-time
          pattern: Z$
        valid_until:
          type: string
          format: date-time
          pattern: Z$
        fresh_until:
          type: string
          format: date-time
          pattern: Z$
        retain_until:
          type: string
          format: date-time
          pattern: Z$
        confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        unit:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        identifier:
          $ref: "#/components/schemas/IdentityIdentifierInput"
      required:
        - kind
        - name
        - verification_id
        - normalization
        - collected_at
        - observed_at
        - valid_from
        - valid_until
        - retain_until
      description: Append an observation, derived fact, claim or identifier. Direct
        observations are tenant-attested; an origin_observation_id imports the actual
        completed Core check outcome. Derived records name existing source records
        and cannot provide a replacement value or invent lineage. Retention is explicitly
        bounded to 30 days and cannot extend source retention; corrections name the
        current record in supersedes.
      allOf:
        - if:
            type: object
            properties:
              kind:
                type: string
                const: observation
            required:
              - kind
          then:
            type: object
            oneOf:
              - type: object
                required:
                  - value
                  - source_name
                  - input_version
                not:
                  type: object
                  required:
                    - origin_observation_id
              - required:
                  - origin_observation_id
                not:
                  anyOf:
                    - required:
                        - value
                    - required:
                        - original
                    - required:
                        - source_name
                    - required:
                        - input_version
                    - required:
                        - confidence_bps
                    - required:
                        - unit
                    - required:
                        - evidence_ids
          else:
            type: object
            required:
              - source_record_ids
            properties:
              source_record_ids:
                type: array
                minItems: 1
            not:
              type: object
              anyOf:
                - required:
                    - value
                - required:
                    - original
                - required:
                    - origin_observation_id
                - required:
                    - source_name
                - required:
                    - input_version
                - required:
                    - evidence_ids
        - if:
            type: object
            properties:
              kind:
                type: string
                const: identifier
            required:
              - kind
          then:
            type: object
            required:
              - identifier
          else:
            type: object
            not:
              type: object
              required:
                - identifier
    IdentityRecord:
      type: object
      additionalProperties: false
