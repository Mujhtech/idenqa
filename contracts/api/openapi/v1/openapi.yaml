        document:
          $ref: "#/components/schemas/CaptureProfileDocument"
    CaptureProfileSupersede:
      description: A complete document from which to create the next draft revision.
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/CaptureProfileDocument"
    CaptureProfile:
      description: Stable capture-profile resource and its current lifecycle pointers.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - state
        - version
        - latest_revision
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/CaptureProfileID"
        name:
          type: string
          example: Standard identity
        state:
          type: string
          enum: [draft, active, deactivated]
          example: draft
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        latest_revision:
          type: integer
          minimum: 1
          example: 1
        draft_revision:
          type: integer
          minimum: 1
          example: 1
        published_revision:
          type: integer
          minimum: 1
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:05:00Z"
        deactivated_at:
          type: string
          format: date-time
          example: "2026-08-28T12:00:00Z"
    CaptureProfileMutation:
      description: Safe result snapshot returned by a profile lifecycle mutation or exact replay.
      type: object
      additionalProperties: false
      required:
        - profile_id
        - name
        - state
        - version
        - latest_revision
        - revision
        - digest
        - updated_at
      properties:
        profile_id:
          $ref: "#/components/schemas/CaptureProfileID"
        name:
          type: string
          example: Standard identity
        state:
          type: string
          enum: [draft, active, deactivated]
          example: draft
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        latest_revision:
          type: integer
          minimum: 1
          example: 1
        draft_revision:
          type: integer
          minimum: 1
          example: 1
        published_revision:
          type: integer
          minimum: 1
          example: 1
        revision:
          type: integer
          minimum: 1
          example: 1
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:05:00Z"
    CaptureProfileRevision:
      description: One numbered capture-profile revision and its immutable document after publication.
      type: object
      additionalProperties: false
      required:
        - profile_id
        - revision
        - state
        - document
        - digest
        - created_at
        - updated_at
      properties:
