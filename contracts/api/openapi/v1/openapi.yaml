  /v1/privacy-requests:
    get:
      tags: [Privacy]
      operationId: listPrivacyRequests
      summary: List tenant privacy requests
      description: Requires privacy_requests:read. Returns a bounded ascending page of data-subject privacy requests with their state, version, and bounded effect references. Reasons, actor identifiers, and internal events are never returned.
      security: [TenantAPIKey: []]
      x-required-scopes: [privacy_requests:read]
      parameters:
        - name: state
          in: query
          required: false
          description: Restrict the page to one exact request state.
          schema: { type: string, enum: [requested, in_review, approved, partially_approved, denied, executing, completed, failed, withdrawn, expired] }
        - name: type
          in: query
          required: false
          description: Restrict the page to one exact request type.
          schema: { type: string, enum: [access, portability, correction, restriction, objection, erasure] }
        - name: subject_id
          in: query
          required: false
          description: Restrict the page to one exact subject scope.
          schema: { type: string, minLength: 1, maxLength: 200, example: sub_01M11HEQG00000000000000000 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded ascending page of privacy requests was returned.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestList' }
              examples:
                page:
                  value: { data: [], page: { has_more: false } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Privacy]
      operationId: createPrivacyRequest
      summary: Create one tenant privacy request
      description: Requires privacy_requests:write. Creates one tenant-channel data-subject request. The tenant is the controller and no effect executes before an explicit approval. Subject-scoped effects require a subject; corrrection instructions carry exactly one record or decision target.
      security: [TenantAPIKey: []]
      x-required-scopes: [privacy_requests:write]
      requestBody:
        required: true
        description: One bounded privacy-request instruction for the selected type.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestCreate' }
            examples:
              access:
                value: { type: access, subject_id: sub_01M11HEQG00000000000000000, region: ng-1 }
      responses:
        '202':
          description: The privacy request was created and awaits review.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' }, Location: { description: URL of the created resource., schema: { type: string, minLength: 1 } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestSummary' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
