          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    TenantAPIKey:
      type: http
      scheme: bearer
      bearerFormat: idq_v1
      description: A display-once tenant API key supplied only in Authorization.
    CaptureToken:
      type: http
      scheme: bearer
      bearerFormat: idq_cap_v1
      description: A session-bound capture token supplied only in Authorization.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum collection items to return. The default is 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        An RFC 9651 String used to deduplicate a consequential request. It is
        scoped to the authenticated tenant and operation. Reusing a key with a
        different canonical request fingerprint is a conflict. Keys are not
        credentials and clients must not place secrets or identity data in them.
      schema:
        type: string
        minLength: 3
        maxLength: 130
      example: '"vs_01M11HEQG00000000000000000"'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong entity tag most recently returned for the resource.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Strong opaque ETag returned by a previous decision response.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
    ProfileID:
      name: profileID
      in: path
      required: true
      description: Stable capture-profile identifier.
      schema:
        $ref: "#/components/schemas/CaptureProfileID"
    ProfileRevision:
      name: revision
      in: path
      required: true
      description: Positive immutable profile revision number.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    VerificationID:
      name: verificationID
      in: path
      required: true
      description: Stable verification-session identifier.
      schema:
        $ref: "#/components/schemas/VerificationSessionID"
    DecisionID:
      name: decisionID
      in: path
      required: true
      description: Stable immutable policy-decision identifier.
      schema:
        $ref: "#/components/schemas/PolicyDecisionID"
    UploadID:
      name: uploadID
      in: path
      required: true
      description: Opaque requirement-bound evidence-upload identifier.
      schema:
        $ref: "#/components/schemas/EvidenceUploadID"
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: Canonical RFC 9530 SHA-256 digest of the complete plaintext body.
      schema:
        type: string
        pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'
      example: "sha-256=:K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=:"
    NoticeID:
      name: noticeID
      in: path
      required: true
      description: Immutable notice-version identifier.
      schema:
        $ref: "#/components/schemas/NoticeVersionID"
  headers:
    XRequestID:
      description: Server-issued request identifier. Caller-supplied values are ignored.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
    ETag:
      description: Strong entity tag for conditional access to this representation.
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    RateLimit:
      description: Current request quota and reset information as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "limit=100, remaining=99, reset=60"
    RateLimitPolicy:
      description: Applied quota policy as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "100;w=60"
    RetryAfter:
      description: Delay in seconds before retrying the request.
      required: false
      schema:
        type: integer
        minimum: 1
    Deprecation:
      description: Deprecation instant encoded as an RFC 9745 Structured Field Date.
      required: false
      schema:
        type: string
      example: "@1798761600"
    Sunset:
      description: Expected retirement time encoded as an RFC 8594 HTTP date.
      required: false
      schema:
        type: string
      example: Thu, 01 Jul 2027 00:00:00 GMT
    Link:
      description: Links to deprecation or successor documentation when applicable.
      required: false
      schema:
        type: string
    WWWAuthenticate:
      description: Minimal Bearer authentication challenge.
      required: true
      schema:
        type: string
      example: Bearer realm="idenqa"
  schemas:
    Tenant:
      type: object
      description: Safe lifecycle metadata for the authenticated tenant.
      example:
        id: ten_01M11HEQG00000000000000000
        state: active
        created_at: "2026-08-27T12:00:00Z"
        updated_at: "2026-08-27T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/TenantID"
        state:
          type: string
          example: active
          enum:
            - active
            - disabled
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
    TenantID:
      type: string
      description: Stable Idenqa tenant identifier.
      pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
      example: ten_01M11HEQG00000000000000000
    CaptureProfileID:
      type: string
      description: Stable Idenqa capture-profile identifier.
      pattern: ^prf_[0-9A-HJKMNP-TV-Z]{26}$
      example: prf_01M11HEQG00000000000000000
    VerificationSessionID:
      type: string
      description: Stable Idenqa verification-session identifier.
      pattern: ^ver_[0-9A-HJKMNP-TV-Z]{26}$
      example: ver_01M11HEQG00000000000000000
    PolicyDecisionID:
      type: string
      description: Stable identifier for one immutable policy decision.
      pattern: ^dec_[0-9A-HJKMNP-TV-Z]{26}$
      example: dec_01M11HEQG00000000000000000
    PolicyID:
      type: string
      description: Stable identifier for one tenant-owned policy.
      pattern: ^pol_[0-9A-HJKMNP-TV-Z]{26}$
      example: pol_01M11HEQG00000000000000000
    PolicyCheckID:
      type: string
      description: Stable identifier for one policy-addressable verification check.
      pattern: ^chk_[0-9A-HJKMNP-TV-Z]{26}$
      example: chk_01M11HEQG00000000000000000
    PolicyAttemptID:
      type: string
      description: Stable identifier for one provider or model execution attempt.
      pattern: ^atm_[0-9A-HJKMNP-TV-Z]{26}$
      example: atm_01M11HEQG00000000000000000
    PolicyObservationID:
      type: string
      description: Stable identifier for one immutable normalised observation.
      pattern: ^obs_[0-9A-HJKMNP-TV-Z]{26}$
      example: obs_01M11HEQG00000000000000000
    PolicyDigest:
      type: string
      description: Lowercase hexadecimal SHA-256 digest of canonical policy data.
      pattern: ^[0-9a-f]{64}$
      example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    PolicyDirective:
      type: string
      description: Closed workflow intent selected by deterministic policy resolution.
      enum:
        - complete_verified
        - complete_not_verified
        - complete_inconclusive
        - request_input
        - run_check
        - retry_check
        - use_fallback
        - route_manual_review
        - fail_workflow
    PolicyOutcome:
      type: string
      description: Authoritative terminal verification conclusion.
      enum: [verified, not_verified, inconclusive]
    PolicyActor:
      type: string
      description: Class of actor that authored the immutable decision.
      enum: [machine, human]
    PolicyRequirementState:
      type: string
      description: Closed result state for one policy requirement.
      enum: [satisfied, not_satisfied, inconclusive, unavailable, prohibited]
    PolicyFactSourceKind:
      type: string
      description: Closed provenance kind for one immutable policy fact.
      enum: [check, processing_authority, subject_response, review_finding]
    PolicyDecisionReport:
      type: object
      description: Bounded reproduction summary that omits facts, reason codes, canonical JSON, and evidence references.
      example:
        schema_major: 1
        schema_minor: 0
        decision_id: dec_01M11HEQG00000000000000000
        tenant_id: ten_01M11HEQG00000000000000000
        verification_id: ver_01M11HEQG00000000000000000
        policy_id: pol_01M11HEQG00000000000000000
        region: ng-1
        policy_revision: 1
        policy_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        evaluator_major: 1
        evaluator_minor: 0
        evaluator_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        snapshot_digest: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        evaluation_digest: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        decision_digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        bundle_digest: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        directive: complete_verified
        outcome: verified
        assurance: idenqa.assurance.identity_verified
        actor: machine
        fact_count: 1
        requirement_count: 1
        evaluated_at: "2026-08-31T12:00:00Z"
        decided_at: "2026-08-31T12:00:01Z"
        reproduced: true
      additionalProperties: false
      required:
        - schema_major
        - schema_minor
        - decision_id
        - tenant_id
        - verification_id
        - policy_id
        - region
        - policy_revision
        - policy_digest
        - evaluator_major
        - evaluator_minor
        - evaluator_digest
        - snapshot_digest
        - evaluation_digest
        - decision_digest
        - bundle_digest
        - directive
        - outcome
        - assurance
        - actor
        - fact_count
        - requirement_count
        - evaluated_at
        - decided_at
        - reproduced
      properties:
        schema_major:
          type: integer
          minimum: 1
          maximum: 65535
          example: 1
        schema_minor:
          type: integer
          minimum: 0
          maximum: 65535
          example: 0
        decision_id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        policy_id:
          $ref: "#/components/schemas/PolicyID"
        region:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
          example: ng-1
        policy_revision:
          type: integer
          minimum: 1
          maximum: 4294967295
        policy_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluator_major:
          type: integer
          minimum: 1
          maximum: 65535
        evaluator_minor:
          type: integer
          minimum: 0
          maximum: 65535
        evaluator_digest:
          $ref: "#/components/schemas/PolicyDigest"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_digest:
          $ref: "#/components/schemas/PolicyDigest"
        bundle_digest:
          $ref: "#/components/schemas/PolicyDigest"
        directive:
          $ref: "#/components/schemas/PolicyDirective"
        outcome:
          $ref: "#/components/schemas/PolicyOutcome"
        assurance:
          type: string
          maxLength: 128
          pattern: ^$|^[a-z][a-z0-9._:-]*$
        actor:
          $ref: "#/components/schemas/PolicyActor"
        supersedes:
          $ref: "#/components/schemas/PolicyDecisionID"
        fact_count:
          type: integer
          minimum: 1
          maximum: 128
        requirement_count:
          type: integer
          minimum: 1
          maximum: 128
        evaluated_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        reproduced:
          type: boolean
          const: true
    PolicyDecisionBundle:
      type: object
      description: Byte-canonical, self-checking decision reproduction envelope; it never contains raw evidence bytes.
      additionalProperties: false
      required:
        - schema_major
        - schema_minor
        - bundle_digest
        - decision_id
        - tenant_id
        - verification_id
        - snapshot_digest
        - evaluation_digest
        - decision_digest
        - snapshot
        - evaluation
        - decision
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        bundle_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        decision_digest:
          $ref: "#/components/schemas/PolicyDigest"
        snapshot:
          $ref: "#/components/schemas/PolicyCanonicalSnapshot"
        evaluation:
          $ref: "#/components/schemas/PolicyCanonicalEvaluation"
        decision:
          $ref: "#/components/schemas/PolicyCanonicalDecision"
    PolicyCanonicalSnapshot:
      type: object
      description: Exact canonical facts and pinned policy and evaluator inputs.
      additionalProperties: false
      required: [schema_major, schema_minor, tenant_id, verification_id, authority_id, acknowledgement_id, region, policy, evaluator, evaluated_at, facts]
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        authority_id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        acknowledgement_id:
          $ref: "#/components/schemas/SubjectResponseID"
        region:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9._:-]*$
        policy:
          $ref: "#/components/schemas/PolicyCanonicalReference"
        evaluator:
          $ref: "#/components/schemas/PolicyCanonicalEvaluator"
        evaluated_at:
          type: string
          format: date-time
        facts:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/PolicyCanonicalFact"
    PolicyCanonicalReference:
      type: object
      description: Exact immutable policy revision used for evaluation.
      additionalProperties: false
      required: [id, revision, schema_major, schema_minor, digest]
      properties:
        id:
          $ref: "#/components/schemas/PolicyID"
        revision:
          type: integer
          minimum: 1
          maximum: 4294967295
        schema_major:
          type: integer
          minimum: 1
          maximum: 65535
        schema_minor:
          type: integer
          minimum: 0
          maximum: 65535
        digest:
          $ref: "#/components/schemas/PolicyDigest"
    PolicyCanonicalEvaluator:
      type: object
      description: Exact evaluator contract and implementation identity.
      additionalProperties: false
      required: [major, minor, digest]
      properties:
        major:
          type: integer
          minimum: 1
          maximum: 65535
        minor:
          type: integer
          minimum: 0
          maximum: 65535
        digest:
          $ref: "#/components/schemas/PolicyDigest"
    PolicyCanonicalFact:
      type: object
      description: Bounded policy fact with immutable provenance references and no raw evidence.
      additionalProperties: false
      required: [key, state, source, observed_at, reason_codes]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        state:
          $ref: "#/components/schemas/PolicyRequirementState"
        source:
          $ref: "#/components/schemas/PolicyCanonicalFactSource"
        observed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Exclusive ticket expiry in UTC.
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalFactSource:
      type: object
      description: Closed source-reference union; the kind selects the valid provenance fields.
      additionalProperties: false
      required: [kind]
      allOf:
        - if:
            properties:
              kind:
                const: check
            required: [kind]
          then:
            type: object
            required: [check_id, check_version, attempt_id, observation_ids, contract_digest, implementation_digest]
            not:
              anyOf:
                - required: [authority_id]
                - required: [acknowledgement_id]
                - required: [review_finding]
        - if:
            properties:
              kind:
                const: processing_authority
            required: [kind]
          then:
            type: object
            required: [authority_id]
            not:
              anyOf:
                - required: [check_id]
                - required: [check_version]
                - required: [attempt_id]
                - required: [observation_ids]
                - required: [contract_digest]
                - required: [implementation_digest]
                - required: [acknowledgement_id]
                - required: [review_finding]
        - if:
            properties:
              kind:
                const: subject_response
            required: [kind]
          then:
            type: object
            required: [acknowledgement_id]
            not:
              anyOf:
                - required: [check_id]
                - required: [check_version]
                - required: [attempt_id]
                - required: [observation_ids]
                - required: [contract_digest]
                - required: [implementation_digest]
                - required: [authority_id]
                - required: [review_finding]
        - if:
            properties:
              kind:
                const: review_finding
            required: [kind]
          then:
            type: object
            required: [review_finding]
            not:
              anyOf:
                - required: [check_id]
                - required: [check_version]
                - required: [attempt_id]
                - required: [observation_ids]
                - required: [contract_digest]
                - required: [implementation_digest]
                - required: [authority_id]
                - required: [acknowledgement_id]
      properties:
        kind:
          $ref: "#/components/schemas/PolicyFactSourceKind"
        check_id:
          $ref: "#/components/schemas/PolicyCheckID"
        check_version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        attempt_id:
          $ref: "#/components/schemas/PolicyAttemptID"
        observation_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicyObservationID"
        contract_digest:
          $ref: "#/components/schemas/PolicyDigest"
        implementation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        authority_id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        acknowledgement_id:
          $ref: "#/components/schemas/SubjectResponseID"
        review_finding:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalEvaluation:
      type: object
      description: Deterministic resolution result for an exact snapshot.
      additionalProperties: false
      required: [schema_major, schema_minor, snapshot_digest, results, considered, selected, outcome, reason_codes]
      if:
        properties:
          selected:
            const: complete_verified
        required: [selected]
      then:
        type: object
        required: [assurance]
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        results:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/PolicyCanonicalRequirementResult"
        considered:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/PolicyDirective"
        selected:
          type: string
          description: Terminal directive authorised by the exported immutable decision.
          enum: [complete_verified, complete_not_verified, complete_inconclusive]
        outcome:
          $ref: "#/components/schemas/PolicyOutcome"
        assurance:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._:-]*$
        reason_codes:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalRequirementResult:
      type: object
      description: Exact result and workflow candidate for one policy requirement.
      additionalProperties: false
      required: [name, state, contributing_facts, candidate, priority, reason_codes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._:-]*$
        state:
          $ref: "#/components/schemas/PolicyRequirementState"
        contributing_facts:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        candidate:
          $ref: "#/components/schemas/PolicyDirective"
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalDecision:
      type: object
      description: Immutable authoritative terminal decision bound to exact canonical inputs.
      additionalProperties: false
      required: [schema_major, schema_minor, id, tenant_id, verification_id, snapshot_digest, evaluation_digest, actor, decided_at]
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        actor:
          $ref: "#/components/schemas/PolicyActor"
        supersedes:
          $ref: "#/components/schemas/PolicyDecisionID"
        decided_at:
          type: string
          format: date-time
    CaptureToken:
      type: string
      description: Display-once bearer credential bound to one verification session.
      minLength: 32
      maxLength: 2048
      pattern: ^idq_cap_v1\.[1-9][0-9]{0,4}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      writeOnly: true
      example: idq_cap_v1.1.eyJ0b2tlbl9pZCI6ImN0a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
    NoticeVersionID:
      description: Stable identifier for one immutable notice version.
      type: string
      pattern: ^ntc_[0-9A-HJKMNP-TV-Z]{26}$
      example: ntc_01M11HEQG00000000000000000
    ProcessingAuthorityID:
      description: Stable identifier for one tenant-declared processing authority.
      type: string
      pattern: ^aut_[0-9A-HJKMNP-TV-Z]{26}$
      example: aut_01M11HEQG00000000000000000
    SubjectID:
      description: Verification-local PII-free subject identifier.
      type: string
      pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
      example: sub_01M11HEQG00000000000000000
    SubjectResponseID:
      description: Stable identifier for one append-only subject response.
      type: string
      pattern: ^ack_[0-9A-HJKMNP-TV-Z]{26}$
      example: ack_01M11HEQG00000000000000000
    NoticeCopy:
      description: Mandatory subject-facing notice copy whose legal meaning tenant branding cannot alter.
      type: object
      example:
        title: Identity verification
        summary: We need to verify your identity.
        purpose: Your evidence is used only for identity verification.
        consequences: You may refuse and collection will not continue.
      additionalProperties: false
      required: [title, summary, purpose, consequences]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 8000
        summary:
          type: string
          minLength: 1
          maxLength: 8000
        purpose:
          type: string
          minLength: 1
          maxLength: 8000
        consequences:
          type: string
          minLength: 1
          maxLength: 8000
    NoticeVersionCreate:
