        available:
          type: boolean
      required:
        - id
        - subject_id
        - actor_key_id
        - kind
        - name
        - value_type
        - schema_version
        - sequence
        - series_id
        - normalization
        - input_version
        - source_class
        - source_classes
        - source_name
        - source_configuration_version
        - verification_id
        - authority_id
        - acknowledgement_id
        - evidence_ids
        - source_record_ids
        - ancestor_ids
        - lineage_roots
        - collected_at
        - observed_at
        - recorded_at
        - valid_from
        - valid_until
        - retain_until
        - current
        - available
      description: Immutable reference metadata with optional explicitly revealed
        values. Current means the record has no successor. New decision eligibility
        also checks current authority, evidence, ancestors, retention, validity and
        configured freshness.
    IdentitySourceBinding:
      type: object
      additionalProperties: false
      properties:
        runner_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-z][a-z0-9._:-]*$
        package_digest:
          $ref: "#/components/schemas/PolicyDigest"
        groups:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
            minLength: 3
            pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          minItems: 1
          uniqueItems: true
      required:
        - runner_id
        - package_digest
        - groups
      description: Accepted provider upstream correlation groups. Unknown providers
        share a conservative group; captured evidence and inherited roots always continue
        to apply.
    IdentityRequirement:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^identity\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        fact_name:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        value_type:
          type: string
          enum:
            - string
            - boolean
            - integer
            - decimal
            - date
            - timestamp
        unit:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        minimum_independent_sources:
          type: integer
          minimum: 1
          maximum: 8
        minimum_confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        require_freshness:
          type: boolean
        maximum_age_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        expected_boolean:
          type: boolean
        source_classes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - tenant_attested
              - provider
              - model
          minItems: 1
          uniqueItems: true
      required:
        - key
        - fact_name
        - value_type
        - minimum_independent_sources
        - minimum_confidence_bps
        - require_freshness
        - maximum_age_seconds
        - source_classes
      description: Requires matching values across independent lineage components.
        Boolean requirements must specify expected_boolean. Freshness requirements
        must specify a positive maximum_age_seconds. Missing or incomplete inputs
        are inconclusive.
    IdentityConfiguration:
      type: object
      example:
        region: ke
        provider_sources: []
        requirements: []
      additionalProperties: false
      properties:
        region:
          type: string
          maxLength: 64
        provider_sources:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/IdentitySourceBinding"
        requirements:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/IdentityRequirement"
      required:
        - region
      description: An immutable per-region configuration revision. One identity:configure
        principal activates it with expected-version checks, idempotency and audit.
        An empty requirements list disables identity fact projection.
    IdentityFinding:
      type: object
      description: Bounded per-key corroboration outcome with its safe reason code.
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        state:
          type: string
          enum:
            - satisfied
            - not_satisfied
            - inconclusive
        reason:
          type: string
          enum:
            - identity.input_unavailable
            - identity.value_mismatch
            - identity.conflicting_values
            - identity.corroborated
        independent_sources:
          type: integer
          minimum: 0
        record_ids:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/IdentityRecordID"
      required:
        - key
        - state
        - reason
        - independent_sources
        - record_ids
    IdentityReceipt:
      type: object
      additionalProperties: false
      properties:
        subject_id:
          type: string
          maxLength: 30
        subject_version:
          type: integer
          format: int64
          minimum: 0
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        configuration_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        configuration_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluated_at:
          type: string
          format: date-time
          pattern: Z$
        findings:
