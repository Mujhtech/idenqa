    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum collection items to return. The default is 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        An RFC 9651 String used to deduplicate a consequential request. It is
        scoped to the authenticated tenant and operation. Reusing a key with a
        different canonical request fingerprint is a conflict. Keys are not
        credentials and clients must not place secrets or identity data in them.
      schema:
        type: string
        minLength: 3
        maxLength: 130
      example: '"vs_01M11HEQG00000000000000000"'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong entity tag most recently returned for the resource.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Strong opaque ETag returned by a previous decision response.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
    ProfileID:
      name: profileID
      in: path
      required: true
      description: Stable capture-profile identifier.
      schema:
        $ref: "#/components/schemas/CaptureProfileID"
    ProfileRevision:
      name: revision
      in: path
      required: true
      description: Positive immutable profile revision number.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    VerificationID:
      name: verificationID
      in: path
      required: true
      description: Stable verification-session identifier.
      schema:
        $ref: "#/components/schemas/VerificationSessionID"
    DecisionID:
      name: decisionID
      in: path
      required: true
      description: Stable immutable policy-decision identifier.
      schema:
        $ref: "#/components/schemas/PolicyDecisionID"
    UploadID:
      name: uploadID
      in: path
      required: true
      description: Opaque requirement-bound evidence-upload identifier.
      schema:
        $ref: "#/components/schemas/EvidenceUploadID"
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: Canonical RFC 9530 SHA-256 digest of the complete plaintext body.
      schema:
        type: string
        pattern: "^sha-256=:[A-Za-z0-9+/]{43}=:$"
      example: "sha-256=:K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=:"
    NoticeID:
      name: noticeID
      in: path
      required: true
      description: Immutable notice-version identifier.
      schema:
        $ref: "#/components/schemas/NoticeVersionID"
  headers:
    XRequestID:
      description: Server-issued request identifier. Caller-supplied values are ignored.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
    ETag:
      description: Strong entity tag for conditional access to this representation.
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    RateLimit:
      description: Current request quota and reset information as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "limit=100, remaining=99, reset=60"
    RateLimitPolicy:
      description: Applied quota policy as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "100;w=60"
    RetryAfter:
      description: Delay in seconds before retrying the request.
      required: false
      schema:
        type: integer
        minimum: 1
    Deprecation:
      description: Deprecation instant encoded as an RFC 9745 Structured Field Date.
      required: false
      schema:
        type: string
      example: "@1798761600"
    Sunset:
      description: Expected retirement time encoded as an RFC 8594 HTTP date.
      required: false
      schema:
        type: string
      example: Thu, 01 Jul 2027 00:00:00 GMT
    Link:
      description: Links to deprecation or successor documentation when applicable.
      required: false
      schema:
        type: string
    WWWAuthenticate:
      description: Minimal Bearer authentication challenge.
      required: true
      schema:
        type: string
      example: Bearer realm="idenqa"
  schemas:
    AssuranceDimension:
      type: string
      description: Independent platform assurance dimension; there is no universal ranking.
      enum:
      - identity_resolution
      - evidence_validation
      - applicant_binding
      - source_independence
      - fraud_resistance
      - human_oversight
      - provenance
      - freshness
      - liveness
      - integrity
      example: liveness
    AssuranceCapabilityName:
      type: string
      description: Platform capability meaning; declarations do not prove successful execution.
      enum:
      - idenqa.assurance.authority_record
      - idenqa.assurance.document_authenticity
      - idenqa.assurance.capture_quality
      - idenqa.assurance.face_match_1to1
      - idenqa.assurance.passive_liveness
      - idenqa.assurance.active_liveness
      - idenqa.assurance.freshness
      - idenqa.assurance.live_capture
      - idenqa.assurance.capture_integrity
      - idenqa.assurance.human_review
      - idenqa.assurance.identity_corroboration
      - idenqa.assurance.fraud_controls
      example: idenqa.assurance.active_liveness
    AssuranceRunnerKind:
      type: string
      description: The owned boundary that produced the recorded source.
      enum:
      - provider
      - model
      - capture
      - review
      - identity
      - fraud
      example: provider
    AssuranceSelection:
      type: object
      description: Exact immutable tenant assurance profile reference.
      additionalProperties: false
      required:
