            maxLength: 100
            pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalDecision:
      type: object
      description: Immutable authoritative terminal decision bound to exact canonical inputs.
      additionalProperties: false
      required:
        [
          schema_major,
          schema_minor,
          id,
          tenant_id,
          verification_id,
          snapshot_digest,
          evaluation_digest,
          actor,
          decided_at,
        ]
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        id:
          $ref: "#/components/schemas/PolicyDecisionID"
        tenant_id:
          $ref: "#/components/schemas/TenantID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        snapshot_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        actor:
          $ref: "#/components/schemas/PolicyActor"
        supersedes:
          $ref: "#/components/schemas/PolicyDecisionID"
        decided_at:
          type: string
          format: date-time
    CaptureToken:
      type: string
      description: Display-once bearer credential bound to one verification session.
      minLength: 32
      maxLength: 2048
      pattern: ^idq_cap_v1\.[1-9][0-9]{0,4}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      writeOnly: true
      example: idq_cap_v1.1.eyJ0b2tlbl9pZCI6ImN0a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
    OutcomeToken:
      type: string
      description: Display-once read-only bearer credential bound to one verification session.
      minLength: 32
      maxLength: 2048
      pattern: ^idq_out_v1\.[1-9][0-9]{0,4}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      writeOnly: true
      example: idq_out_v1.1.eyJ0b2tlbl9pZCI6Im90a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
    NoticeVersionID:
      description: Stable identifier for one immutable notice version.
      type: string
      pattern: ^ntc_[0-9A-HJKMNP-TV-Z]{26}$
      example: ntc_01M11HEQG00000000000000000
    ProcessingAuthorityID:
      description: Stable identifier for one tenant-declared processing authority.
      type: string
      pattern: ^aut_[0-9A-HJKMNP-TV-Z]{26}$
      example: aut_01M11HEQG00000000000000000
    SubjectID:
      description: Verification-local PII-free subject identifier.
      type: string
      pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
      example: sub_01M11HEQG00000000000000000
    SubjectResponseID:
      description: Stable identifier for one append-only subject response.
      type: string
      pattern: ^ack_[0-9A-HJKMNP-TV-Z]{26}$
      example: ack_01M11HEQG00000000000000000
    NoticeCopy:
      description: Mandatory subject-facing notice copy whose legal meaning tenant branding cannot alter.
      type: object
      example:
        title: Identity verification
        summary: We need to verify your identity.
        purpose: Your evidence is used only for identity verification.
        consequences: You may refuse and collection will not continue.
      additionalProperties: false
      required: [title, summary, purpose, consequences]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 8000
        summary:
          type: string
          minLength: 1
          maxLength: 8000
        purpose:
          type: string
          minLength: 1
          maxLength: 8000
        consequences:
          type: string
          minLength: 1
          maxLength: 8000
    NoticeVersionCreate:
      description: Request to create one immutable content-addressed notice version.
      type: object
      additionalProperties: false
      required: [key, locale, controller, recipient, copy, effective_at]
      properties:
        key:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.notice.identity_verification
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: ^[A-Za-z0-9-]+$
          example: en-NG
        controller:
          type: string
          minLength: 1
          maxLength: 200
          example: Example Tenant
        recipient:
          type: string
          minLength: 1
          maxLength: 200
          example: Example Recipient
        copy:
          $ref: "#/components/schemas/NoticeCopy"
        effective_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
    NoticeVersion:
      description: Immutable content-addressed subject-facing notice version.
      type: object
      additionalProperties: false
      required: [id, key, locale, controller, recipient, copy, effective_at, created_at, digest]
      properties:
        id:
          $ref: "#/components/schemas/NoticeVersionID"
        key:
          type: string
          example: tenant.notice.identity_verification
        locale:
          type: string
          example: en-NG
        controller:
          type: string
          example: Example Tenant
        recipient:
          type: string
          example: Example Recipient
        copy:
          $ref: "#/components/schemas/NoticeCopy"
        effective_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
    ProcessingAuthorityDeclare:
      description: Tenant declaration recorded and enforced without Idenqa selecting or certifying a lawful basis.
      type: object
      additionalProperties: false
      required:
        - notice_id
        - category
        - purpose
        - jurisdiction
        - policy_pack
        - consent_required
        - recipient_reference
        - recipient_display_name
        - regions
        - retention_reference
        - valid_from
        - expires_at
      properties:
        notice_id:
          $ref: "#/components/schemas/NoticeVersionID"
        category:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.authority.customer_declared
        purpose:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.purpose.identity_verification
        jurisdiction:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.jurisdiction.ng
        policy_pack:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.policy.identity_v1
        consent_required:
          type: boolean
          example: true
        recipient_reference:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.recipient.primary
        recipient_display_name:
          type: string
          minLength: 1
          maxLength: 200
          example: Example Recipient
        regions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          example: [idenqa.region.synthetic]
          items:
            type: string
            minLength: 3
            maxLength: 200
            pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
        retention_reference:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: tenant.retention.identity_v1
        valid_from:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-08-28T12:00:00Z"
    ProcessingAuthority:
      description: Current lifecycle projection of one immutable processing-authority declaration.
      type: object
      additionalProperties: false
      required:
        - id
        - subject_id
        - verification_id
        - notice_id
        - category
        - purpose
        - jurisdiction
        - policy_pack
        - consent_required
        - requirement_purposes
        - evidence_types
        - recipient_reference
        - recipient_display_name
        - regions
        - retention_reference
        - state
        - version
        - valid_from
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        subject_id:
          $ref: "#/components/schemas/SubjectID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        notice_id:
          $ref: "#/components/schemas/NoticeVersionID"
        category:
          type: string
          example: tenant.authority.customer_declared
        purpose:
          type: string
          example: tenant.purpose.identity_verification
        jurisdiction:
          type: string
          example: tenant.jurisdiction.ng
        policy_pack:
          type: string
          example: tenant.policy.identity_v1
        consent_required:
          type: boolean
          example: true
        requirement_purposes:
          type: array
          example: [idenqa.purpose.identity_verification]
          items: { type: string }
        evidence_types:
          type: array
          example: [idenqa.evidence.selfie_image]
          items: { type: string }
        recipient_reference:
          type: string
          example: tenant.recipient.primary
        recipient_display_name:
          type: string
          example: Example Recipient
        regions:
          type: array
          example: [idenqa.region.synthetic]
          items: { type: string }
        retention_reference:
          type: string
          example: tenant.retention.identity_v1
        state:
          type: string
          enum: [active, restricted, withdrawn, superseded]
          example: active
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        valid_from:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-08-28T12:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
    SubjectResponseCreate:
      description: One explicit acknowledgement, consent, or refusal from the session-bound capture principal.
      type: object
      additionalProperties: false
      required: [action, locale]
      properties:
        action:
          type: string
          enum: [acknowledge, consent, refuse]
          example: consent
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: ^[A-Za-z0-9-]+$
          example: en-NG
        rendered_experience_version:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)+$
          example: capture.notice.v1
    SubjectResponse:
      description: Append-only receipt of an interaction, not proof of civil identity or understanding.
      type: object
      additionalProperties: false
      required:
        [id, authority_id, notice_id, subject_id, verification_id, action, locale, recorded_at]
      properties:
        id:
          $ref: "#/components/schemas/SubjectResponseID"
        authority_id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        notice_id:
          $ref: "#/components/schemas/NoticeVersionID"
        subject_id:
          $ref: "#/components/schemas/SubjectID"
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        action:
          type: string
          enum: [acknowledge, consent, refuse]
          example: consent
        locale:
          type: string
          example: en-NG
        rendered_experience_version:
          type: string
          example: capture.notice.v1
        recorded_at:
          type: string
          format: date-time
          example: "2026-08-27T12:05:00Z"
    CaptureAuthoritySnapshot:
      description: Capture-visible current authority, exact notice, and optional latest response.
      type: object
      additionalProperties: false
      required: [authority, notice]
      properties:
        authority:
          $ref: "#/components/schemas/ProcessingAuthority"
        notice:
          $ref: "#/components/schemas/NoticeVersion"
        latest_response:
          $ref: "#/components/schemas/SubjectResponse"
    VerificationCancel:
      description: Explicit optimistic precondition for a cancellation command.
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
          description: The session version observed by the caller.
          example: 1
    VerificationCancellation:
      description: Immutable receipt for committed verification cancellation.
      type: object
      additionalProperties: false
      required: [event_id, verification_id, state, version, occurred_at]
      properties:
        event_id:
          type: string
          pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
          description: Stable lifecycle event identifier for this cancellation.
          example: evt_01M11HEQG00000000000000000
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        state:
          type: string
          enum: [cancelled]
          description: The committed workflow state, separate from identity outcome.
          example: cancelled
        version:
          type: integer
          format: int64
          minimum: 2
          description: The resulting session version.
          example: 2
        occurred_at:
          type: string
          format: date-time
          description: The original committed cancellation timestamp.
          example: "2026-09-06T12:00:00Z"
    VerificationResume:
      description: Optimistic precondition for an awaiting-input resume command.
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
          example: 4
    VerificationResumed:
      description: Reference-only resume result with a display-once replacement bearer when required.
      type: object
      additionalProperties: false
      required: [session, capture_token_id, capture_token_expires_at, replaced, replayed]
      properties:
        session:
          $ref: "#/components/schemas/VerificationSession"
        capture_token_id:
          type: string
          pattern: ^ctk_[0-9A-HJKMNP-TV-Z]{26}$
          example: ctk_01M11HEQG00000000000000000
        capture_token_expires_at:
          type: string
          format: date-time
          example: "2026-09-19T10:35:00Z"
        capture_token:
          type: string
          $ref: "#/components/schemas/CaptureToken"
          description: Present only for the first successful request that replaced an unusable credential.
          example: idq_cap_v1.1.eyJ0b2tlbl9pZCI6ImN0a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
        replaced:
          type: boolean
          example: false
        replayed:
          type: boolean
          example: false
    VerificationCreate:
      description: Tenant request to snapshot an active published capture profile.
      type: object
      additionalProperties: false
      required: [capture_profile_id, policy_id]
      properties:
        capture_profile_id:
          $ref: "#/components/schemas/CaptureProfileID"
        policy_id:
          $ref: "#/components/schemas/PolicyID"
        verification_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Optional tenant-requested lifetime subject to deployment bounds.
          example: 86400
        capture_token_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Optional initial capture-token lifetime subject to deployment bounds.
          example: 1800
        outcome_token_post_expiry_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Optional outcome-token lifetime after verification expiry, subject to deployment bounds.
          example: 86400
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          description: Optional BCP 47 locale resolved and pinned with the portable experience.
          example: en-NG
        experience:
          type: object
          additionalProperties: false
          description: Optional capture-experience targeting context resolved and pinned at creation. Unproven dimensions fail closed to the signed safe default.
          properties:
            workflow:
              type: string
              maxLength: 128
              pattern: ^[a-z][a-z0-9._-]{0,127}$
              example: capture.identity
            country:
              type: string
              pattern: ^[A-Z]{2}$
              example: NG
            application_id:
              type: string
              minLength: 1
              maxLength: 200
              example: dev.acme.app
            origin:
              type: string
              minLength: 1
              maxLength: 2048
              pattern: ^https://
              example: https://capture.acme.example
            sdk_version:
              type: string
              pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
              example: 1.4.0
    VerificationSession:
      description: Immutable capture requirements and current lifecycle metadata for one verification.
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - version
        - profile_id
        - profile_revision
        - profile_digest
        - policy_id
        - region
        - requirements
        - created_at
        - updated_at
        - expires_at
      properties:
        id:
          $ref: "#/components/schemas/VerificationSessionID"
        state:
          type: string
          description: |
            Verification workflow state, separate from the identity decision.
            The alpha lifecycle expansion was approved on 6 September 2026.
            Recognising a state does not imply that its initiating operation is available.
          enum:
            [
              created,
              collecting,
              awaiting_input,
              processing,
              awaiting_external,
              manual_review,
              completed,
              cancelled,
              expired,
              failed,
            ]
          example: collecting
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        profile_id:
          $ref: "#/components/schemas/CaptureProfileID"
        profile_revision:
          type: integer
          minimum: 1
          example: 1
        profile_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
        policy_id:
          $ref: "#/components/schemas/PolicyID"
        region:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
          description: Immutable processing and storage region selected by the server.
          example: ng-1
        requested_input:
          description: |
            Active policy-authored subject-input request. Present only while the
            session is `awaiting_input`, omitted for every other state, and never
            present on the subject-safe capture-token projection. It carries no
            evidence, policy facts, or actor identity.
          type: object
          example:
            reason_codes: [document_authenticity_unavailable]
            requested_at: "2026-08-27T12:00:01Z"
          $ref: "#/components/schemas/VerificationInputRequest"
        requirements:
          $ref: "#/components/schemas/CaptureProfileDocument"
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-08-28T12:00:00Z"
        failure:
          description: |
            Operational failure projection. Present only for the terminal `failed`
            state and omitted for every other state and for the subject-safe
            capture-token projection. It states that the workflow could not
            proceed; it is never an identity outcome, decision reference, raw
            evidence, or provider payload.
          type: object
          example:
            class: policy
            code: workflow_prohibited
          $ref: "#/components/schemas/VerificationFailure"
        current_decision:
          description: |
            Current immutable decision projection. Present only when the caller holds
            `decisions:read` and a current decision exists for the verification; omitted
            otherwise.
          type: object
          example:
            decision_id: dec_01M11HEQG00000000000000000
            outcome: verified
            directive: complete_verified
            decided_at: "2026-08-31T12:00:01Z"
          $ref: "#/components/schemas/VerificationDecisionReference"
        current_case:
          description: |
            Current review case projection. Present only when the caller holds
            `reviews:read` and a review case currently references the verification;
            omitted otherwise.
          type: object
          example:
            case_id: rvc_01M11HEQG00000000000000000
            state: claimed
            version: 1
          $ref: "#/components/schemas/VerificationCaseReference"
    VerificationFailure:
      type: object
      description: |
        Bounded operational failure classification for a verification workflow
        that reached the terminal `failed` state. It explains that the workflow
        could not proceed and never carries an identity outcome, decision
        reference, raw evidence, or provider payload.
      additionalProperties: false
      required: [class, code]
      properties:
        class:
          type: string
          maxLength: 32
          pattern: ^[a-z][a-z0-9_]{0,31}$
          description: Bounded failure class naming the writer that failed the workflow.
          example: policy
        code:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: Bounded machine-readable failure code within its class.
          example: workflow_prohibited
    VerificationDecisionReference:
      type: object
      description: Current immutable decision reference for one verification without policy facts or evidence.
      additionalProperties: false
      required: [decision_id, outcome, directive, decided_at]
      properties:
        decision_id:
          $ref: "#/components/schemas/PolicyDecisionID"
        outcome:
          $ref: "#/components/schemas/PolicyOutcome"
        directive:
          $ref: "#/components/schemas/PolicyDirective"
        decided_at:
          type: string
          format: date-time
          description: Instant the referenced immutable decision was recorded.
          example: "2026-08-31T12:00:01Z"
    VerificationCaseReference:
      type: object
      description: Current review case reference for one verification without findings or evidence.
      additionalProperties: false
      required: [case_id, state, version]
      properties:
        case_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable tenant-scoped review-case identifier.
          example: rvc_01M11HEQG00000000000000000
        state:
          type: string
          minLength: 1
          maxLength: 256
          description: Bounded review-case lifecycle state such as open, claimed, awaiting_second, resolved, or escalated.
          example: claimed
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic version of the referenced review case.
          example: 1
    VerificationInputRequest:
      type: object
      description: |
        Bounded projection of the active policy-authored subject-input request.
        It states which input policy requested without exposing evidence, policy
        facts, provider payloads, or the recording actor.
      additionalProperties: false
      required: [reason_codes, requested_at]
      properties:
        reason_codes:
          type: array
          minItems: 1
          maxItems: 8
          description: |
            Deterministic bounded policy reason codes. Codes outside the closed
            lowercase token grammar are dropped, and `policy_request_input` is
            recorded when the evaluation carries no bounded code.
          items:
            type: string
            pattern: ^[a-z][a-z0-9._:-]{0,63}$
            example: document_authenticity_unavailable
        requested_at:
          type: string
          format: date-time
          description: Instant the policy routing recorded the input request.
          example: "2026-08-27T12:00:01Z"
        case_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional review case that owns a linked recapture request.
          example: rvc_01M11HEQG00000000000000000
    VerificationCreated:
      description: A new verification session and its display-once capture and read-only outcome credentials.
      type: object
      additionalProperties: false
      required: [session, capture_token, outcome_token, outcome_token_expires_at]
      properties:
        session:
          $ref: "#/components/schemas/VerificationSession"
        capture_token:
          $ref: "#/components/schemas/CaptureToken"
        outcome_token:
          $ref: "#/components/schemas/OutcomeToken"
        outcome_token_expires_at:
          type: string
          format: date-time
          description: Signed expiry of the read-only outcome credential.
          example: "2026-08-29T12:00:00Z"
    CaptureOutcome:
      type: object
      description: |
        Minimal outcome-token-scoped workflow or terminal-decision projection.
        The state is authoritative, but deliberately carries no diagnostic or
        policy explanation that could disclose sensitive decision internals.
      additionalProperties: false
      required: [verification_id, state, session_version, updated_at]
      properties:
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        state:
          type: string
          enum:
            [
              capture_required,
              processing,
              action_required,
              verified,
              not_verified,
              inconclusive,
              cancelled,
              expired,
              failed,
            ]
          description: Subject-safe workflow or terminal-decision state.
          example: processing
        session_version:
          type: integer
          format: int64
          minimum: 1
          example: 3
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:06:00Z"
    EvidenceUploadID:
      type: string
      description: Stable opaque identifier for one requirement-bound upload intent.
      pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
      example: upl_01M11HEQG00000000000000000
    EvidenceID:
      type: string
      description: Stable opaque identifier preallocated for the accepted evidence artefact.
      pattern: ^evd_[0-9A-HJKMNP-TV-Z]{26}$
      example: evd_01M11HEQG00000000000000000
    CaptureFallbackCondition:
      type: string
      description: Policy-approved reason for selecting a fallback acquisition branch.
      enum: [capability_unavailable, method_unavailable, capture_failed]
    CaptureCompletion:
      type: object
      description: Minimal immutable binding for one accepted capture step.
      additionalProperties: false
      required:
        - upload_id
        - evidence_id
        - requirement_key
        - evidence_type
        - artefact
        - acquisition_method
      properties:
        upload_id:
          $ref: "#/components/schemas/EvidenceUploadID"
        evidence_id:
          $ref: "#/components/schemas/EvidenceID"
        requirement_key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        evidence_type:
          type: string
          minLength: 1
          maxLength: 200
        artefact:
          type: string
          minLength: 1
          maxLength: 200
        acquisition_method:
          type: string
          minLength: 1
          maxLength: 200
        fallback_condition:
          type: string
          $ref: "#/components/schemas/CaptureFallbackCondition"
          example: capture_failed
    CaptureProgress:
      type: object
      description: Capture-token-scoped accepted completion snapshot with the session's pinned portable-experience versions when available.
      additionalProperties: false
      required: [verification_id, completions]
      properties:
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        completions:
          type: array
          maxItems: 256
          example: []
          items:
            $ref: "#/components/schemas/CaptureCompletion"
        experience:
          type: object
          description: The exact experience, locale, and copy versions pinned to this session.
          additionalProperties: false
          required: [experience_id, version, locale, tenant_copy_version, mandatory_copy_version, source, digest, key_id, pinned_at]
          properties:
            experience_id: { $ref: "#/components/schemas/ExperienceID" }
            version: { type: integer, minimum: 1, example: 1 }
            locale: { type: string, minLength: 2, maxLength: 35, example: en }
            tenant_copy_version: { type: string, maxLength: 64, example: tc_acme_v1 }
            mandatory_copy_version: { type: string, maxLength: 32, example: mc-2026-09-01 }
            source: { type: string, enum: [pinned, published, default], example: pinned }
            digest: { type: string, pattern: '^[0-9a-f]{64}$', example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
            key_id: { type: string, maxLength: 64, example: expkey_core_1 }
            pinned_at: { type: string, format: date-time, example: '2026-09-20T12:00:00Z' }
    CaptureConnection:
      type: object
      description: Display-once browser connection material. Treat websocket_url as a secret.
      example:
        websocket_url: wss://core.example.test/v1/capture/socket?ticket=idq_wst_v1_REDACTED
        protocol: idenqa.capture.v1
        expires_at: "2026-08-30T12:00:30Z"
      additionalProperties: false
      required: [websocket_url, protocol, expires_at]
      properties:
        websocket_url:
          type: string
          format: uri
          pattern: ^wss?://
          description: Short-lived URL containing one single-use ticket in its query.
        protocol:
          type: string
          const: idenqa.capture.v1
        expires_at:
          type: string
          format: date-time
    NativeBootstrapRequest:
      description: Single-use native application proof and non-authoritative capability advertisement.
      type: object
      additionalProperties: false
      required:
        [
          application_id,
          proof_key,
          proof_created_at,
          proof_algorithm,
          proof_format,
          proof,
          capabilities,
        ]
      properties:
        application_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9._-]+$
          example: dev.idenqa.capture
        proof_key:
          type: string
          minLength: 40
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
          example: QkFTRTY0VVJMX1BMQVRGT1JNX1AyNTZfUFVCTElDX0tFWQ
        proof_created_at:
          type: integer
          format: int64
          minimum: 1
          example: 1788523200
        proof_algorithm:
          type: string
          enum: [ES256]
          example: ES256
        proof_format:
          type: string
          enum: [der]
          example: der
        proof:
          type: string
          minLength: 40
          maxLength: 256
          pattern: ^[A-Za-z0-9_-]+$
          example: QkFTRTY0VVJMX0RFUl9TSUdOQVRVUkVfVkFMVUUA
        attestation:
          type: string
          minLength: 1
          maxLength: 16384
          example: QkFTRTY0VVJMX1BMQVRGT1JNX0FUVEVTVEFUSU9O
        capabilities:
          $ref: "#/components/schemas/NativeCapabilities"
    NativeCapabilities:
      description: Implemented and currently available SDK methods; this is not assurance evidence.
      type: object
      additionalProperties: false
      required: [platform, sdk_version, implemented_methods, currently_available_methods]
      properties:
        platform:
          type: string
          enum: [ios, android]
          example: ios
        sdk_version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          example: 0.1.0
        implemented_methods:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          example: [camera]
        currently_available_methods:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          example: [camera]
    EvidenceUploadCreate:
      type: object
      description: Body-free immutable claim used to issue one evidence-upload intent.
      additionalProperties: false
      required:
        - requirement_key
        - artefact
        - acquisition_method
        - expected_bytes
        - expected_digest
        - media_type
        - region
      properties:
        requirement_key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          example: selfie
        artefact:
          type: string
          minLength: 1
          maxLength: 200
          example: idenqa.artefact.selfie_image
        acquisition_method:
          type: string
          minLength: 1
          maxLength: 200
          example: idenqa.method.file_upload
        fallback_condition:
          type: string
          $ref: "#/components/schemas/CaptureFallbackCondition"
          example: capability_unavailable
        expected_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
          example: 245760
        expected_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
        media_type:
          type: string
          enum: [image/jpeg, image/png]
          example: image/jpeg
        region:
          type: string
          minLength: 1
          maxLength: 200
          example: idenqa.region.synthetic
    EvidenceUpload:
      type: object
      description: Safe upload lifecycle and immutable capture binding; integrity digests are intentionally absent.
      additionalProperties: false
      required:
        - id
        - evidence_id
        - state
        - version
        - attempt
        - requirement_key
        - evidence_type
        - artefact
        - acquisition_method
        - assurances
        - allowed_media_types
        - maximum_bytes
        - expected_bytes
        - media_type
        - region
        - created_at
        - updated_at
        - expires_at
      properties:
        id:
          $ref: "#/components/schemas/EvidenceUploadID"
        evidence_id:
          $ref: "#/components/schemas/EvidenceID"
        state:
          type: string
          enum: [issued, uploading, accepted, rejected, expired]
          example: issued
        version:
          type: integer
          format: int64
          minimum: 1
          example: 1
        attempt:
          type: integer
          minimum: 0
          example: 0
        requirement_key:
          type: string
          example: selfie
        evidence_type:
          type: string
          example: idenqa.evidence.selfie_image
        artefact:
          type: string
          example: idenqa.artefact.selfie_image
        acquisition_method:
          type: string
          example: idenqa.method.file_upload
        fallback_condition:
          type: string
          $ref: "#/components/schemas/CaptureFallbackCondition"
          example: capture_failed
        assurances:
          type: array
          example: []
          items:
            type: string
        allowed_media_types:
          type: array
          minItems: 1
          maxItems: 2
          example: [image/jpeg]
          items:
            type: string
            enum: [image/jpeg, image/png]
        maximum_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
          example: 16777216
        expected_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 67108864
          example: 245760
        media_type:
          type: string
          enum: [image/jpeg, image/png]
          example: image/jpeg
        region:
          type: string
          example: idenqa.region.synthetic
        created_at:
          type: string
          format: date-time
          example: "2026-08-30T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-30T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-08-30T12:15:00Z"
        accepted_at:
          type: string
          format: date-time
          example: "2026-08-30T12:01:00Z"
    CaptureProfileDocument:
      description: A complete portable capture-profile document bound to one exact evidence registry revision.
      $ref: ../../../capture-profile/v1/profile.schema.json
      x-go-type: json.RawMessage
    CaptureProfileWrite:
      description: A complete mutable capture-profile draft representation.
      type: object
