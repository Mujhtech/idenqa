  /v1/capture/progress:
    get:
      operationId: getCaptureProgress
      summary: Recover accepted capture-step completion
      description: |
        Returns only accepted evidence identifiers and their immutable capture
        bindings for the exact authenticated capture token and verification.
        Raw evidence, filenames, integrity digests, object identity, and subject
        data are intentionally absent.
        Clients may send If-None-Match with the previous opaque progress ETag;
        304 means the accepted completion projection has not changed.
      tags: [Capture]
      security:
        - CaptureToken: []
      parameters:
        - name: If-None-Match
          in: header
          description: Strong opaque ETag returned by a previous capture-progress response.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The authoritative accepted-step completion snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProgress"
              example:
                verification_id: ver_01M11HEQG00000000000000000
                completions:
                  - upload_id: upl_01M11HEQG00000000000000000
                    evidence_id: evd_01M11HEQG00000000000000000
                    requirement_key: selfie
                    evidence_type: idenqa.evidence.selfie_image
                    artefact: idenqa.artefact.selfie_image
                    acquisition_method: idenqa.method.file_upload
        "304":
          description: The accepted-step projection has not changed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture/native/bootstrap:
    post:
      operationId: bootstrapNativeCapture
      summary: Bind a native application proof key and recover the capture session
      description: |
        Redeems the tenant-backend-issued capture token once, verifies an ES256
        proof from a hardware-backed P-256 key, and atomically binds that token
        to one configured native application identity and proof-key digest.
        Optional platform attestation supplements but never replaces proof of
        possession. Replays and changed-key attempts return the generic capture
        authentication failure.
      tags: [Capture]
      security:
        - CaptureToken: []
      requestBody:
        description: Signed native application proof and capability advertisement.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeBootstrapRequest"
            example:
              application_id: dev.idenqa.capture
              proof_key: QkFTRTY0VVJMX1BMQVRGT1JNX1AyNTZfUFVCTElDX0tFWQ
              proof_created_at: 1788523200
              proof_algorithm: ES256
              proof_format: der
              proof: QkFTRTY0VVJMX0RFUl9TSUdOQVRVUkVfVkFMVUUA
              capabilities:
                platform: ios
                sdk_version: 0.1.0
                implemented_methods: [camera]
                currently_available_methods: [camera]
      responses:
        "200":
          description: The token was bound and the active capture session returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              description: Prevents storage of bootstrap material.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
