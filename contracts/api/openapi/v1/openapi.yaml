        regions: { type: array, minItems: 1, maxItems: 16, items: { type: string, minLength: 1, maxLength: 63 }, example: [ng-1] }
        transfer_mechanism: { type: string, minLength: 1, maxLength: 128, example: standard.contractual_clauses }
        version: { type: integer, format: int64, minimum: 1, example: 1 }
        created_at: { type: string, format: date-time, example: '2026-09-20T12:00:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-09-20T12:00:00Z' }
    PrivacyProcessorPut:
      type: object
      description: One create or expected-version processor inventory command.
      additionalProperties: false
      required: [name, role, purpose, data_classes, regions, transfer_mechanism, expected_version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: Example KYC }
        role: { $ref: '#/components/schemas/PrivacyProcessorRole' }
        purpose: { type: string, minLength: 1, maxLength: 128, example: identity.verification }
        data_classes: { type: array, minItems: 1, maxItems: 8, items: { type: string, enum: [raw_evidence, derived_evidence, webhook_payload, workflow_metadata, audit_record, deletion_proof, backup] }, example: [raw_evidence] }
        regions: { type: array, minItems: 1, maxItems: 16, items: { type: string, minLength: 1, maxLength: 63 }, example: [ng-1] }
        transfer_mechanism: { type: string, minLength: 1, maxLength: 128, example: standard.contractual_clauses }
        expected_version: { type: integer, format: int64, minimum: 0, description: Zero creates version one; a positive value applies one expected-version update., example: 0 }
    PrivacyProcessorList:
      type: object
      description: Bounded ascending processor inventory page.
      additionalProperties: false
      required: [data, page]
      properties:
        data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PrivacyProcessor' }, example: [] }
        page: { $ref: '#/components/schemas/Page' }
    SubjectPrivacyStatus:
