    get:
      operationId: streamWebhookEvents
      summary: Stream live catalogue events
      description:
        Requires webhooks:read. Server-Sent Events feed of decrypted canonical catalogue envelopes.
        Each event frame carries its durable sequence as the SSE id and the canonical envelope as data;
        reconnect with the Last-Event-ID header to resume after that sequence. Heartbeat comments keep
        the connection alive. Receivers must deduplicate by event id.
      tags:
        - Webhooks
