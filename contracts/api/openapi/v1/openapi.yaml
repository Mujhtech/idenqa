      additionalProperties: false
      required: [session, capture_token]
      properties:
        session:
          $ref: "#/components/schemas/VerificationSession"
        capture_token:
          $ref: "#/components/schemas/CaptureToken"
    EvidenceUploadID:
      type: string
      description: Stable opaque identifier for one requirement-bound upload intent.
      pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
      example: upl_01M11HEQG00000000000000000
    EvidenceID:
      type: string
      description: Stable opaque identifier preallocated for the accepted evidence artefact.
      pattern: ^evd_[0-9A-HJKMNP-TV-Z]{26}$
      example: evd_01M11HEQG00000000000000000
    CaptureFallbackCondition:
      type: string
      description: Policy-approved reason for selecting a fallback acquisition branch.
      enum: [capability_unavailable, method_unavailable, capture_failed]
    CaptureCompletion:
      type: object
      description: Minimal immutable binding for one accepted capture step.
      additionalProperties: false
      required:
        - upload_id
        - evidence_id
        - requirement_key
        - evidence_type
        - artefact
        - acquisition_method
      properties:
        upload_id:
          $ref: "#/components/schemas/EvidenceUploadID"
        evidence_id:
          $ref: "#/components/schemas/EvidenceID"
        requirement_key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        evidence_type:
          type: string
          minLength: 1
          maxLength: 200
        artefact:
          type: string
          minLength: 1
          maxLength: 200
        acquisition_method:
          type: string
          minLength: 1
          maxLength: 200
        fallback_condition:
          type: string
          $ref: "#/components/schemas/CaptureFallbackCondition"
          example: capture_failed
    CaptureProgress:
      type: object
      description: Capture-token-scoped accepted completion snapshot.
      additionalProperties: false
      required: [verification_id, completions]
      properties:
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        completions:
          type: array
          maxItems: 256
          example: []
          items:
            $ref: "#/components/schemas/CaptureCompletion"
    CaptureConnection:
      type: object
      description: Display-once browser connection material. Treat websocket_url as a secret.
      example:
        websocket_url: wss://core.example.test/v1/capture/socket?ticket=idq_wst_v1_REDACTED
        protocol: idenqa.capture.v1
        expires_at: "2026-08-30T12:00:30Z"
      additionalProperties: false
      required: [websocket_url, protocol, expires_at]
      properties:
        websocket_url:
          type: string
          format: uri
          pattern: ^wss?://
          description: Short-lived URL containing one single-use ticket in its query.
        protocol:
          type: string
          const: idenqa.capture.v1
        expires_at:
          type: string
          format: date-time
    NativeBootstrapRequest:
      description: Single-use native application proof and non-authoritative capability advertisement.
      type: object
      additionalProperties: false
      required: [application_id, proof_key, proof_created_at, proof_algorithm, proof_format, proof, capabilities]
      properties:
        application_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9._-]+$
          example: dev.idenqa.capture
        proof_key:
          type: string
          minLength: 40
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
          example: QkFTRTY0VVJMX1BMQVRGT1JNX1AyNTZfUFVCTElDX0tFWQ
        proof_created_at:
          type: integer
          format: int64
          minimum: 1
          example: 1788523200
        proof_algorithm:
          type: string
          enum: [ES256]
          example: ES256
        proof_format:
          type: string
          enum: [der]
          example: der
        proof:
          type: string
          minLength: 40
          maxLength: 256
          pattern: ^[A-Za-z0-9_-]+$
          example: QkFTRTY0VVJMX0RFUl9TSUdOQVRVUkVfVkFMVUUA
        attestation:
          type: string
          minLength: 1
          maxLength: 16384
          example: QkFTRTY0VVJMX1BMQVRGT1JNX0FUVEVTVEFUSU9O
        capabilities:
          $ref: "#/components/schemas/NativeCapabilities"
    NativeCapabilities:
      description: Implemented and currently available SDK methods; this is not assurance evidence.
      type: object
      additionalProperties: false
      required: [platform, sdk_version, implemented_methods, currently_available_methods]
      properties:
        platform:
          type: string
          enum: [ios, android]
          example: ios
        sdk_version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          example: 0.1.0
        implemented_methods:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          example: [camera]
        currently_available_methods:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          example: [camera]
