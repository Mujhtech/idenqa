      properties:
        subject:
          $ref: "#/components/schemas/IdentitySubject"
        record:
          $ref: "#/components/schemas/IdentityRecord"
        subjects:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IdentitySubject"
        records:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IdentityRecord"
        verification_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VerificationSessionID"
        next_cursor:
          type: string
          maxLength: 200
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        configuration:
          $ref: "#/components/schemas/IdentityConfiguration"
        receipt:
          $ref: "#/components/schemas/IdentityReceipt"
        digest:
          $ref: "#/components/schemas/PolicyDigest"
        deletion_id:
          type: string
          maxLength: 30
          pattern: ^del_[0-9A-HJKMNP-TV-Z]{26}$
    IdentityIdentifierLookup:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          example: ng.nin
        issuer:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        normalization:
          type: string
          enum:
            - identity.exact.v1
            - identity.trim.v1
            - identity.ascii_upper.v1
        value:
          type: string
          maxLength: 200
          minLength: 1
      required:
        - namespace
        - issuer
        - normalization
        - value
      description: Exact lookup within the tenant, region, namespace, issuer and canonicalisation
        version. Multiple matching subjects remain distinct; lookup never merges them.
    ProposalActionKind:
      type: string
      description: Closed allow-list of non-authoritative proposal action kinds.
      enum: [review.copilot.summarize, routing.adaptive.suggest, policy.draft.generate, policy.diff.generate, policy.adversarial.generate, experience.accessibility.propose, experience.exception.propose, document.layout.propose]
      example: review.copilot.summarize
    Proposal:
      type: object
      description: Immutable non-authoritative proposal envelope with pinned model and prompt provenance.
      required: [proposal_id, tenant_id, mode, status, actions, model_id, model_version, prompt_version, context_digest, expires_at, created_at, version]
      properties:
        proposal_id: { type: string, pattern: '^prp_[0-9A-HJKMNP-TV-Z]{26}$', example: prp_01M11HEQG00000000000000000 }
        tenant_id: { type: string, pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$', example: ten_01M11HEQG00000000000000000 }
        verification_id: { type: string, pattern: '^ver_[0-9A-HJKMNP-TV-Z]{26}$', example: ver_01M11HEQG00000000000000000 }
        policy_id: { type: string, pattern: '^pol_[0-9A-HJKMNP-TV-Z]{26}$', example: pol_01M11HEQG00000000000000000 }
        mode: { type: string, enum: [disabled, assist, recommend, guardrailed_auto, human_required], example: assist }
        status: { type: string, enum: [pending, approved, rejected, expired, cancelled, superseded], example: pending }
        actions: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ProposalAction' }, example: [{ kind: review.copilot.summarize, args: {} }] }
        evidence_refs: { type: array, maxItems: 32, items: { type: string }, example: [evd_01M11HEQG00000000000000000] }
        signal_refs: { type: array, maxItems: 32, items: { type: string }, example: [sig_01M11HEQG00000000000000000] }
        model_id: { type: string, maxLength: 64, example: model.test }
        model_version: { type: string, maxLength: 64, example: v1 }
        prompt_version: { type: string, maxLength: 64, example: p1 }
        context_digest: { type: string, pattern: '^[0-9a-f]{64}$', example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
        expires_at: { type: string, format: date-time, example: '2026-09-10T12:00:00Z' }
        created_at: { type: string, format: date-time, example: '2026-09-10T12:00:00Z' }
        version: { type: integer, minimum: 1, example: 1 }
        reason: { type: string, maxLength: 512, example: tenant_requested }
    ProposalAction:
      type: object
      description: One bounded action whose args schema is selected by kind.
      required: [kind, args]
      properties:
        kind: { $ref: '#/components/schemas/ProposalActionKind' }
        args: { type: object, description: Closed JSON args per kind, max 8KiB, additionalProperties: true, example: { summary: true } }
    ProposalRequest:
      type: object
      description: Create one proposal for a verification or a policy under the session mode.
      required: [mode, actions, model_id, model_version, prompt_version, context_digest, expires_at]
      properties:
        verification_id: { type: string, pattern: '^ver_[0-9A-HJKMNP-TV-Z]{26}$', example: ver_01M11HEQG00000000000000000 }
        policy_id: { type: string, pattern: '^pol_[0-9A-HJKMNP-TV-Z]{26}$', example: pol_01M11HEQG00000000000000000 }
        mode: { type: string, enum: [disabled, assist, recommend, guardrailed_auto, human_required], example: assist }
        actions: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ProposalAction' }, example: [{ kind: review.copilot.summarize, args: {} }] }
        evidence_refs: { type: array, maxItems: 32, items: { type: string }, example: [evd_01M11HEQG00000000000000000] }
        signal_refs: { type: array, maxItems: 32, items: { type: string }, example: [sig_01M11HEQG00000000000000000] }
        model_id: { type: string, maxLength: 64, example: model.test }
        model_version: { type: string, maxLength: 64, example: v1 }
        prompt_version: { type: string, maxLength: 64, example: p1 }
        context_digest: { type: string, pattern: '^[0-9a-f]{64}$', example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
        expires_at: { type: string, format: date-time, example: '2026-09-10T12:00:00Z' }
        supersedes: { type: string, pattern: '^prp_[0-9A-HJKMNP-TV-Z]{26}$', example: prp_01M11HEQG00000000000000000 }
    ProposalApproveRequest:
      type: object
      description: Human approval of one pending proposal under an expected version.
      required: [expected_version, human_approved]
      properties:
        expected_version: { type: integer, minimum: 1, example: 1 }
        human_approved: { type: boolean, example: true }
    ProposalVersionRequest:
      type: object
      description: Version precondition for reject or cancel of one pending proposal.
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1, example: 1 }
    ModeConfig:
      type: object
      description: Versioned per-workflow automation mode and permitted action kinds.
      required: [workflow, mode, version]
      properties:
        workflow: { type: string, minLength: 1, maxLength: 64, example: verification }
        mode: { type: string, enum: [disabled, assist, recommend, guardrailed_auto, human_required], example: assist }
        allowed_kinds: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ProposalActionKind' }, example: [review.copilot.summarize] }
        version: { type: integer, minimum: 1, example: 1 }
    PromptCreate:
      type: object
      description: Register an immutable prompt revision for one generative model.
      required: [content, model_id]
      properties:
        content: { type: string, minLength: 1, maxLength: 16384, example: Summarise the review findings. }
        model_id: { type: string, maxLength: 64, example: model.test }
    Prompt:
      type: object
      description: Immutable prompt revision with its digest and generating model.
      required: [prompt_id, version, content, digest, model_id]
      properties:
        prompt_id: { type: string, pattern: '^prm_[0-9A-HJKMNP-TV-Z]{26}$', example: prm_01M11HEQG00000000000000000 }
        version: { type: integer, minimum: 1, example: 1 }
        content: { type: string, example: Summarise the review findings. }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
        model_id: { type: string, example: model.test }
    PrivacyDeletionID:
      type: string
      description: Stable Idenqa deletion-workflow identifier.
      pattern: ^del_[0-9A-HJKMNP-TV-Z]{26}$
      example: del_01M11HEQG00000000000000000
    PrivacyTargetState:
      type: string
      description: Observable state of one exact deletion target.
      enum: [pending, deleted, failed]
      example: pending
    PrivacyDeletionState:
      type: string
      description: Observable deletion-workflow state.
      enum: [requested, blocked_by_legal_hold, in_progress, awaiting_backup_expiry, completed, failed]
      example: in_progress
    PrivacyTarget:
      type: object
      description: Safe target projection. The reference is a stable non-reversible digest, never an object location or encoded evidence reference.
      additionalProperties: false
      required: [kind, reference, state]
      properties:
        kind: { type: string, minLength: 1, maxLength: 64, example: raw_evidence }
        reference: { type: string, minLength: 1, maxLength: 64, description: Opaque non-reversible target-reference digest., example: 3f2a0c9d1b4e6a8c0d2f4b6a }
        state: { $ref: '#/components/schemas/PrivacyTargetState' }
        failure_class: { type: string, maxLength: 128, example: target_unavailable }
    PrivacyHold:
      type: object
      description: One legal hold covering the aggregate. Hold documents and evidence are never returned.
      additionalProperties: false
      required: [id, aggregate_id, authority, reason, starts_at, review_at]
      properties:
        id: { type: string, pattern: '^hld_[0-9A-HJKMNP-TV-Z]{26}$', example: hld_01M11HEQG00000000000000000 }
        aggregate_id: { type: string, minLength: 1, maxLength: 200, example: ver_01M11HEQG00000000000000000 }
        authority: { type: string, minLength: 1, maxLength: 128, example: court-order }
        reason: { type: string, minLength: 1, maxLength: 256, example: pending proceedings }
        starts_at: { type: string, format: date-time, example: '2026-09-06T00:00:00Z' }
        review_at: { type: string, format: date-time, example: '2026-10-06T00:00:00Z' }
        released_at: { type: string, format: date-time, description: Present only while a released hold is still observably active. }
    PrivacyDeletionSummary:
      type: object
      description: Safe deletion-workflow summary without target references or evidence metadata.
      additionalProperties: false
      required: [id, aggregate_id, region, state, target_count, backup_expires_at, version, requested_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/PrivacyDeletionID' }
        aggregate_id: { type: string, minLength: 1, maxLength: 200, example: ver_01M11HEQG00000000000000000 }
        region: { type: string, minLength: 1, maxLength: 63, example: ng-1 }
        state: { $ref: '#/components/schemas/PrivacyDeletionState' }
        target_count: { type: integer, minimum: 1, maximum: 256, example: 2 }
        backup_expires_at: { type: string, format: date-time, description: Documented backup boundary; completion never precedes it., example: '2026-10-11T00:00:00Z' }
        failure_class: { type: string, maxLength: 128, example: target_unavailable }
        version: { type: integer, format: int64, minimum: 1, example: 3 }
        requested_at: { type: string, format: date-time, example: '2026-09-06T00:00:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-09-06T00:05:00Z' }
    PrivacyDeletionStatus:
      type: object
      description: Full safe deletion-workflow status with exact target states, active holds, and the documented backup boundary.
      additionalProperties: false
      required: [id, aggregate_id, region, state, target_count, backup_expires_at, version, requested_at, updated_at, targets, holds]
      properties:
        id: { $ref: '#/components/schemas/PrivacyDeletionID' }
        aggregate_id: { type: string, minLength: 1, maxLength: 200, example: ver_01M11HEQG00000000000000000 }
        region: { type: string, minLength: 1, maxLength: 63, example: ng-1 }
        state: { $ref: '#/components/schemas/PrivacyDeletionState' }
        target_count: { type: integer, minimum: 1, maximum: 256, example: 2 }
        backup_expires_at: { type: string, format: date-time, example: '2026-10-11T00:00:00Z' }
        failure_class: { type: string, maxLength: 128, example: target_unavailable }
        version: { type: integer, format: int64, minimum: 1, example: 3 }
        requested_at: { type: string, format: date-time, example: '2026-09-06T00:00:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-09-06T00:05:00Z' }
        targets: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/PrivacyTarget' }, example: [{ kind: raw_evidence, reference: 3f2a0c9d1b4e6a8c0d2f4b6a, state: deleted }] }
        holds: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PrivacyHold' }, example: [] }
    PrivacyDeletionList:
      type: object
      description: Bounded ascending deletion-workflow page with a signed tenant-, filter-, collection- and limit-bound cursor.
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PrivacyDeletionSummary' }
        page: { $ref: '#/components/schemas/Page' }
      example:
        data: []
        page:
          has_more: false
    PrivacyRetentionRecord:
      type: object
      description: One retained evidence record with its recomputed typed retention resolution. Content and object locations are never returned.
      additionalProperties: false
      required: [id, data_class, region, duration_seconds, expires_at]
