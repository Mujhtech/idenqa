          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experience' }
              example: { id: exp_01J00000000000000000000000, state: published, revision: 3, latest_version: 2, approved_version: 2, published_version: 2, document: { schema_version: '1.0', experience_id: exp_01J00000000000000000000000, version: 1, name: Acme selfie capture, copy: { version: tc_acme_v1, locales: [{ locale: en, entries: [{ key: capture.title, value: Verify your identity }] }] }, mandatory_copy_version: mc-2026-09-01, default_locale: en, targeting: [{ workflow: capture.identity, countries: [NG] }], links: { support: https://acme.example/support, privacy: https://acme.example/privacy, terms: https://acme.example/terms }, theme: { primary_color: '#1f6feb', accent_color: '#0b3d91', background_color: '#ffffff', text_color: '#1b1f23' } }, created_at: '2026-09-20T12:00:00Z', updated_at: '2026-09-20T12:05:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
