        overlap_seconds: 3600
    WebhookDisable:
      type: object
      description: "Disable an endpoint using a non-sensitive reason code. Applies to webhook Disable."
      additionalProperties: false
      required:
        - expected_version
        - reason
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_.:-]*$
          minLength: 1
          maxLength: 64
      example:
        expected_version: 2
        reason: tenant_requested
    WebhookReplay:
      type: object
      description: "Replay an exhausted delivery with a distinct delivery ID and unchanged event ID and exact body. Applies to webhook Replay."
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_.:-]*$
          minLength: 1
          maxLength: 64
      example:
        reason: receiver_recovered
    WebhookEndpointMutation:
      type: object
      description:
        Safe mutation receipt. signing_secret is a display-once unpadded Base64URL 32-byte secret
        on initial create/rotate only. Idempotent retries return the original metadata with replayed=true
        and omit the secret; lost secrets require a new authorised rotation after any active overlap.
      additionalProperties: false
      required:
        - endpoint
        - replayed
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        replayed:
          type: boolean
        signing_secret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: false
      example:
        endpoint: *id002_2
        replayed: true
    WebhookDeliveryMutation:
      type: object
      description:
        Safe replay receipt. A repeated command returns the same delivery without scheduling another
        task.
      additionalProperties: false
      required:
        - delivery
        - replayed
      properties:
        delivery:
          $ref: "#/components/schemas/WebhookDelivery"
        replayed:
          type: boolean
      example:
        delivery: *id003_2
        replayed: false
    WebhookEndpointList:
      type: object
      description: Ascending identifier page, with a tenant-, collection- and limit-bound cursor.
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        page:
          $ref: "#/components/schemas/Page"
      example:
        data:
          - *id002_2
        page:
          has_more: false
    WebhookDeliveryList:
      type: object
      description: Ascending identifier page for one endpoint; event bodies are omitted.
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        page:
          $ref: "#/components/schemas/Page"
      example:
        data:
          - *id003_2
        page:
          has_more: false
    WebhookEvent:
      type: object
      description: One canonical catalogue envelope decrypted for an authorised tenant reader.
      additionalProperties: false
      required:
        - id
        - type
        - schema_version
        - created_at
        - tenant_id
        - region
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
        type:
          type: string
          pattern: ^[a-z][a-z0-9_.-]*$
        schema_version:
          type: string
          minLength: 1
          maxLength: 16
        created_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
        region:
          type: string
          minLength: 1
          maxLength: 64
        data:
          type: object
          additionalProperties: true
      example:
        id: evt_01M11HEQG00000000000000001
        type: verification.completed
        schema_version: "1.0"
        created_at: "2026-09-19T10:00:00Z"
        tenant_id: ten_01M11HEQG00000000000000000
        region: ng-lagos
        data:
          verification_id: ver_01M11HEQG00000000000000000
    WebhookEventList:
      type: object
      description: Ascending insertion-order page of decrypted canonical catalogue envelopes.
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebhookEvent"
        page:
          $ref: "#/components/schemas/Page"
      example:
        data: []
        page:
          has_more: false
    WebhookAttemptList:
      type: object
      description: All retained attempts for the visible delivery, ascending by number and bounded to 20.
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookAttempt"
      example:
        data: []
    Tenant:
      type: object
      description: Safe lifecycle metadata for the authenticated tenant.
      example:
        id: ten_01M11HEQG00000000000000000
        state: active
        created_at: "2026-08-27T12:00:00Z"
        updated_at: "2026-08-27T12:00:00Z"
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/TenantID"
        state:
          type: string
          example: active
          enum:
            - active
            - disabled
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
    TenantID:
      type: string
      description: Stable Idenqa tenant identifier.
      pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
      example: ten_01M11HEQG00000000000000000
    CaptureProfileID:
      type: string
      description: Stable Idenqa capture-profile identifier.
      pattern: ^prf_[0-9A-HJKMNP-TV-Z]{26}$
      example: prf_01M11HEQG00000000000000000
    VerificationSessionID:
      type: string
      description: Stable Idenqa verification-session identifier.
      pattern: ^ver_[0-9A-HJKMNP-TV-Z]{26}$
      example: ver_01M11HEQG00000000000000000
    PolicyDecisionID:
      type: string
      description: Stable identifier for one immutable policy decision.
      pattern: ^dec_[0-9A-HJKMNP-TV-Z]{26}$
      example: dec_01M11HEQG00000000000000000
    PolicyID:
      type: string
      description: Stable identifier for one tenant-owned policy.
      pattern: ^pol_[0-9A-HJKMNP-TV-Z]{26}$
      example: pol_01M11HEQG00000000000000000
    PolicyCheckID:
      type: string
      description: Stable identifier for one policy-addressable verification check.
      pattern: ^chk_[0-9A-HJKMNP-TV-Z]{26}$
      example: chk_01M11HEQG00000000000000000
    PolicyAttemptID:
      type: string
      description: Stable identifier for one provider or model execution attempt.
      pattern: ^atm_[0-9A-HJKMNP-TV-Z]{26}$
      example: atm_01M11HEQG00000000000000000
    PolicyObservationID:
      type: string
      description: Stable identifier for one immutable normalised observation.
      pattern: ^obs_[0-9A-HJKMNP-TV-Z]{26}$
      example: obs_01M11HEQG00000000000000000
    PolicyDigest:
      type: string
      description: Lowercase hexadecimal SHA-256 digest of canonical policy data.
      pattern: ^[0-9a-f]{64}$
      example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    PolicyDirective:
      type: string
      description: Closed workflow intent selected by deterministic policy resolution.
      enum:
        - complete_verified
        - complete_not_verified
        - complete_inconclusive
        - request_input
        - run_check
        - retry_check
        - use_fallback
        - route_manual_review
        - fail_workflow
    PolicyOutcome:
      type: string
      description: Authoritative terminal verification conclusion.
      enum: [verified, not_verified, inconclusive]
    PolicyActor:
      type: string
      description: Class of actor that authored the immutable decision.
      enum: [machine, human]
    PolicyRequirementState:
      type: string
      description: Closed result state for one policy requirement.
      enum: [satisfied, not_satisfied, inconclusive, unavailable, prohibited]
    PolicyFactSourceKind:
      type: string
      description: Closed provenance kind for one immutable policy fact.
      enum:
        - check
        - processing_authority
        - subject_response
        - review_finding
        - fraud
        - identity
    PolicyDecisionReport:
      type: object
      description: Bounded reproduction summary that omits facts, reason codes, canonical JSON, and evidence references.
      example:
        schema_major: 1
