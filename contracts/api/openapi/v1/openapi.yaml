          $ref: "#/components/schemas/CaptureProfileID"
        revision:
          type: integer
          minimum: 1
          example: 1
        state:
          type: string
          enum: [draft, published, superseded, withdrawn]
          example: published
        document:
          $ref: "#/components/schemas/CaptureProfileDocument"
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T12:05:00Z"
        published_at:
          type: string
          format: date-time
          example: "2026-08-27T12:05:00Z"
        ended_at:
          type: string
          format: date-time
          example: "2026-09-27T12:05:00Z"
    CaptureProfileList:
      description: A bounded descending page of capture-profile resources.
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          example: []
          items:
            $ref: "#/components/schemas/CaptureProfile"
        page:
          $ref: "#/components/schemas/Page"
    CaptureProfileValidation:
      description: Successful result of applying the publication gate to the current draft.
      type: object
      additionalProperties: false
      required: [valid, digest]
      properties:
        valid:
          type: boolean
          const: true
          example: true
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
    RequestID:
      type: string
      description: Stable server-issued request correlation identifier.
      pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
      example: req_01M11HEQG00000000000000000
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: Opaque, integrity-protected continuation state. Clients must not parse it.
    Page:
      type: object
      description: Opaque cursor pagination metadata.
      example:
        has_more: false
      additionalProperties: false
      required:
        - has_more
      properties:
        next_cursor:
          $ref: "#/components/schemas/Cursor"
        has_more:
          type: boolean
    ProblemCode:
      type: string
      description: Stable machine-readable failure classification.
      example: NOT_FOUND
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - INSUFFICIENT_SCOPE
        - PROCESSING_AUTHORITY_REQUIRED
        - CAPTURE_ORIGIN_NOT_ALLOWED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - IDEMPOTENCY_CONFLICT
        - PRECONDITION_FAILED
        - REQUEST_TOO_LARGE
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - REQUEST_CANCELLED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - REQUEST_TIMEOUT
    Problem:
      type: object
      description: Safe RFC 9457 problem details extended with an Idenqa code and request ID.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - request_id
      properties:
        type:
          type: string
          format: uri
          example: https://idenqa.dev/problems/not-found
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 404
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
          minLength: 1
          maxLength: 500
          example: The requested resource was not found.
        request_id:
          $ref: "#/components/schemas/RequestID"
    FraudSignal:
      type: string
      description: Closed tenant-local fraud signal vocabulary evaluated by versioned rules.
      enum:
        - device_reuse
        - identifier_reuse
        - document_reuse
        - portrait_reuse
        - capture_replay
        - verification_velocity
        - network_anomaly
        - provider_inconsistency
        - identity_inconsistency
        - session_timing
        - failed_liveness
        - high_risk_model
    FraudTokenKind:
      type: string
      description: Kind of tenant-scoped token accepted as fraud evidence.
      enum:
        - subject
        - device
        - identifier
        - portrait
        - address
        - provider_event
        - network
    FraudSource:
      type: object
      description: Accepted tenant token source with its permitted token kinds.
      additionalProperties: false
      required:
        - key_id
        - namespace
        - kinds
        - portrait_permitted
      properties:
        key_id:
          type: string
          pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
          example: key_01M11HEQG00000000000000000
        namespace: &id001
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._:-]{0,127}$
          example: primary
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/FraudTokenKind"
          maxItems: 9
        portrait_permitted:
          type: boolean
    FraudMapping:
