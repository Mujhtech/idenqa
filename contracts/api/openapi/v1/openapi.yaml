            pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          minItems: 1
          uniqueItems: true
      required:
        - runner_id
        - package_digest
        - groups
      description: Accepted provider upstream correlation groups. Unknown providers
        share a conservative group; captured evidence and inherited roots always continue
        to apply.
    IdentityRequirement:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^identity\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        fact_name:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        value_type:
          type: string
          enum:
            - string
            - boolean
            - integer
            - decimal
            - date
            - timestamp
        unit:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        minimum_independent_sources:
          type: integer
          minimum: 1
          maximum: 8
        minimum_confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        require_freshness:
          type: boolean
        maximum_age_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        expected_boolean:
          type: boolean
        source_classes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - tenant_attested
              - provider
              - model
          minItems: 1
          uniqueItems: true
      required:
        - key
        - fact_name
        - value_type
        - minimum_independent_sources
        - minimum_confidence_bps
        - require_freshness
        - maximum_age_seconds
        - source_classes
      description: Requires matching values across independent lineage components.
        Boolean requirements must specify expected_boolean. Freshness requirements
        must specify a positive maximum_age_seconds. Missing or incomplete inputs
        are inconclusive.
    IdentityConfiguration:
      type: object
      additionalProperties: false
      properties:
        region:
          type: string
          maxLength: 64
        provider_sources:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/IdentitySourceBinding"
        requirements:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/IdentityRequirement"
      required:
        - region
      description: An immutable per-region configuration revision. One identity:configure
        principal activates it with expected-version checks, idempotency and audit.
        An empty requirements list disables identity fact projection.
    IdentityFinding:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        state:
          type: string
          enum:
            - satisfied
            - not_satisfied
            - inconclusive
        reason:
          type: string
          enum:
            - identity.input_unavailable
            - identity.value_mismatch
            - identity.conflicting_values
            - identity.corroborated
        independent_sources:
          type: integer
          minimum: 0
        record_ids:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/IdentityRecordID"
      required:
        - key
        - state
        - reason
        - independent_sources
        - record_ids
    IdentityReceipt:
      type: object
      additionalProperties: false
      properties:
        subject_id:
          type: string
          maxLength: 30
        subject_version:
          type: integer
          format: int64
          minimum: 0
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        configuration_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        configuration_digest:
          $ref: "#/components/schemas/PolicyDigest"
        evaluated_at:
          type: string
          format: date-time
          pattern: Z$
        findings:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/IdentityFinding"
      required:
        - subject_id
        - subject_version
        - verification_id
        - configuration_version
        - configuration_digest
        - evaluated_at
        - findings
      description: Immutable reference-only receipt. An empty subject_id and version
        zero record that the session had no persistent-subject binding.
    IdentityResult:
      type: object
      additionalProperties: false
      properties:
        subject:
          $ref: "#/components/schemas/IdentitySubject"
        record:
          $ref: "#/components/schemas/IdentityRecord"
        subjects:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IdentitySubject"
        records:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IdentityRecord"
        verification_ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VerificationSessionID"
        next_cursor:
          type: string
          maxLength: 200
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        configuration:
          $ref: "#/components/schemas/IdentityConfiguration"
        receipt:
          $ref: "#/components/schemas/IdentityReceipt"
        digest:
          $ref: "#/components/schemas/PolicyDigest"
        deletion_id:
          type: string
          maxLength: 30
          pattern: ^del_[0-9A-HJKMNP-TV-Z]{26}$
    IdentityIdentifierLookup:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        issuer:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        normalization:
          type: string
          enum:
            - identity.exact.v1
            - identity.trim.v1
            - identity.ascii_upper.v1
        value:
          type: string
          maxLength: 200
          minLength: 1
      required:
        - namespace
        - issuer
        - normalization
        - value
      description: Exact lookup within the tenant, region, namespace, issuer and canonicalisation
        version. Multiple matching subjects remain distinct; lookup never merges them.
