    WebhookAttempt:
      type: object
      description:
        Bounded callback diagnostics with an optional sanitised response excerpt; no signature
        or event body.
      additionalProperties: false
      required:
        - number
        - secret_version
        - status_code
        - error_class
        - retry_after_ms
        - response_truncated
        - completed_at
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        secret_version:
          type: integer
          format: int64
          minimum: 1
        status_code:
          type: integer
          minimum: 0
          maximum: 599
        error_class:
          type: string
        retry_after_ms:
          type: integer
          format: int64
          minimum: 0
        response_body:
          type:
            - string
            - "null"
          maxLength: 4096
          description:
            At most 4096 bytes of receiver response content, sanitised to valid UTF-8 with
            invalid sequences replaced. Untrusted receiver content, never parsed as structured
            data. Null when no response body was received.
        response_truncated:
          type: boolean
          description:
            True when receiver response bytes were dropped because the body exceeded 4096 bytes
            or was shortened while sanitising invalid UTF-8.
