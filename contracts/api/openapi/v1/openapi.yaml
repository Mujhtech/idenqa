            - integer
            - decimal
            - date
            - timestamp
        value:
          type: string
          maxLength: 4096
          minLength: 1
      required:
        - type
        - value
      description: A sensitive typed scalar. Numeric values are canonical decimal
        strings to preserve precision; dates use YYYY-MM-DD and timestamps use UTC
        RFC3339. Values are encrypted in storage and revealed only with identity:reveal.
    IdentitySubject:
      type: object
