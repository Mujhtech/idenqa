        - schema_major
        - schema_minor
        - verified_assurance
        - rules
      properties:
        schema_major:
          example: 1
          type: integer
          enum:
            - 1
        schema_minor:
          example: 0
          type: integer
          enum:
            - 0
        verified_assurance:
          example: "synthetic.fixture"
          type: string
          maxLength: 128
        rules:
          example:
            [
              {
                "name": "synthetic_success",
                "when": 'facts["synthetic.document"] == "satisfied" && facts["synthetic.liveness"] == "satisfied"',
                "result":
                  {
                    "state": "satisfied",
                    "directive": "complete_verified",
                    "priority": 1,
                    "contributing_facts": ["synthetic.document", "synthetic.liveness"],
                    "reason_codes": [],
                  },
              },
            ]
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - when
              - result
            properties:
              name:
                example: "synthetic_success"
                allOf:
                  - type: string
                    pattern: ^[a-z][a-z0-9._:-]*$
                  - maxLength: 128
              when:
                example: 'facts["synthetic.document"] == "satisfied"'
                type: string
                minLength: 1
                maxLength: 2048
              result:
                type: object
                additionalProperties: false
                required:
                  - state
                  - directive
                  - priority
                  - contributing_facts
                  - reason_codes
                allOf:
                  - if:
                      properties:
                        state:
                          const: prohibited
                      required:
                        - state
                    then:
                      properties:
                        directive:
                          const: fail_workflow
                  - if:
                      properties:
                        directive:
                          const: complete_verified
                      required:
                        - directive
                    then:
                      properties:
                        state:
                          const: satisfied
                  - if:
                      properties:
                        directive:
                          const: complete_not_verified
                      required:
                        - directive
                    then:
                      properties:
                        state:
                          const: not_satisfied
                  - if:
                      properties:
                        directive:
                          const: complete_inconclusive
                      required:
                        - directive
                    then:
                      properties:
                        state:
                          enum:
                            - inconclusive
                            - unavailable
                properties:
                  state:
                    example: "satisfied"
                    enum:
                      - satisfied
                      - not_satisfied
                      - inconclusive
                      - unavailable
                      - prohibited
                  directive:
                    example: "complete_verified"
                    enum:
                      - complete_verified
                      - complete_not_verified
                      - complete_inconclusive
                      - request_input
                      - run_check
                      - retry_check
                      - use_fallback
                      - route_manual_review
                      - fail_workflow
                  priority:
                    example: 1
                    type: integer
                    minimum: 1
                    maximum: 1000
                  contributing_facts:
                    example: ["synthetic.document"]
                    type: array
                    minItems: 1
                    maxItems: 128
                    uniqueItems: true
                    items:
                      type: string
                      maxLength: 128
                      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
                  reason_codes:
                    example: []
                    type: array
                    maxItems: 16
                    uniqueItems: true
                    items:
                      allOf:
                        - type: string
                          pattern: ^[a-z][a-z0-9._:-]*$
                        - maxLength: 100
      example: &id002_1
        schema_major: 1
        schema_minor: 0
        verified_assurance: synthetic.fixture
        rules: &id005_1
          - name: synthetic_success
            when: facts["synthetic.document"] == "satisfied" && facts["synthetic.liveness"] == "satisfied"
            result:
              state: satisfied
              directive: complete_verified
              priority: 1
              contributing_facts:
                - synthetic.document
                - synthetic.liveness
              reason_codes: []
