        - evaluator_digest
        - snapshot_digest
        - evaluation_digest
        - decision_digest
        - bundle_digest
        - directive
        - outcome
        - assurance
        - actor
        - fact_count
        - requirement_count
        - evaluated_at
        - decided_at
        - reproduced
      properties:
        typed_assurance:
