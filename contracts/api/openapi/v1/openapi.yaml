        input_version:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        normalization:
          type: string
          enum:
            - identity.exact.v1
            - identity.trim.v1
            - identity.ascii_upper.v1
        supersedes:
