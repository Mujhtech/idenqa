          maxItems: 64
          items:
            $ref: "#/components/schemas/IdentityRecordID"
          uniqueItems: true
        origin_observation_id:
          $ref: "#/components/schemas/PolicyObservationID"
        source_name:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        input_version:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        normalization:
          type: string
          enum:
            - identity.exact.v1
            - identity.trim.v1
            - identity.ascii_upper.v1
        value:
          $ref: "#/components/schemas/IdentityValue"
        original:
          $ref: "#/components/schemas/IdentityValue"
        supersedes:
          $ref: "#/components/schemas/IdentityRecordID"
        collected_at:
          type: string
          format: date-time
          pattern: Z$
        observed_at:
          type: string
          format: date-time
          pattern: Z$
        valid_from:
          type: string
          format: date-time
          pattern: Z$
        valid_until:
          type: string
          format: date-time
          pattern: Z$
        fresh_until:
          type: string
          format: date-time
          pattern: Z$
        retain_until:
          type: string
          format: date-time
          pattern: Z$
        confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        unit:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        identifier:
          $ref: "#/components/schemas/IdentityIdentifierInput"
      required:
        - kind
        - name
        - verification_id
        - normalization
        - collected_at
        - observed_at
        - valid_from
        - valid_until
        - retain_until
      description: Append an observation, derived fact, claim or identifier. Direct
        observations are tenant-attested; an origin_observation_id imports the actual
        completed Core check outcome. Derived records name existing source records
        and cannot provide a replacement value or invent lineage. Retention is explicitly
        bounded to 30 days and cannot extend source retention; corrections name the
        current record in supersedes.
      allOf:
        - if:
            properties:
              kind:
                const: observation
            required:
              - kind
          then:
            oneOf:
              - required:
                  - value
                  - source_name
                  - input_version
                not:
                  required:
                    - origin_observation_id
              - required:
                  - origin_observation_id
                not:
                  anyOf:
                    - required:
                        - value
                    - required:
                        - original
                    - required:
                        - source_name
                    - required:
                        - input_version
                    - required:
                        - confidence_bps
                    - required:
                        - unit
                    - required:
                        - evidence_ids
          else:
            required:
              - source_record_ids
            properties:
              source_record_ids:
                minItems: 1
            not:
              anyOf:
                - required:
                    - value
                - required:
                    - original
                - required:
                    - origin_observation_id
                - required:
                    - source_name
                - required:
                    - input_version
                - required:
                    - evidence_ids
        - if:
            properties:
              kind:
                const: identifier
            required:
              - kind
          then:
            required:
              - identifier
          else:
            not:
              required:
                - identifier
