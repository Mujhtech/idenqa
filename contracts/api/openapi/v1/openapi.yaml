openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Idenqa Core API
  version: 1.0.0-alpha.1
  description: |
    Public HTTP contract for the open-source Idenqa core. The URI major version
    is the compatibility boundary. Additive changes may be made within v1;
    incompatible changes require a new URI major version unless a security or
    correctness issue makes preserving the old behaviour unsafe.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Idenqa maintainers
    url: https://github.com/Mujhtech/idenqa
servers:
  - url: /
    description: Current Idenqa deployment
tags:
  - name: Assurance
    description: Typed assurance profiles, capability mappings, and immutable session requirements.
  - name: Tenant
    description: Authenticated tenant metadata.
  - name: Capture profiles
    description: Tenant-owned versioned evidence collection requirements.
  - name: Verifications
    description: Tenant-created verification sessions and immutable capture requirement snapshots.
  - name: Decisions
    description: Reproduced immutable policy-decision summaries and explicitly authorised portable exports.
  - name: Processing authority
    description: Tenant-declared processing authority, immutable notices, and subject responses.
  - name: Capture
    description: Capture-client bootstrap using a session-bound capture token.
  - name: Webhooks
    description: Tenant-owned endpoint administration and payload-free delivery inspection.
  - name: Policies
    description: Immutable policy revisions and authorised activation history.
  - name: Manual review
    description: Audited review operations, controlled evidence display and independent policy follow-up.
  - name: Fraud
    description: Tenant-isolated correlation, versioned rules and evidence-linked risk receipts.
  - name: Identity
    description: Tenant subjects, encrypted claims, immutable observations and facts, and deterministic provenance.
paths:
  /v1/tenant:
    get:
      operationId: getCurrentTenant
      summary: Get the authenticated tenant
      description: Returns lifecycle metadata visible to the tenant represented by the API key.
      tags:
        - Tenant
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The current tenant was returned successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              examples:
                active:
                  $ref: "#/components/examples/ActiveTenant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture-profiles:
    get:
      operationId: listCaptureProfiles
      summary: List capture profiles
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A descending page of capture profiles.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProfileList"
              examples:
                page:
                  $ref: "#/components/examples/CaptureProfileList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createCaptureProfile
      summary: Create a capture-profile draft
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The name and complete registry-bound document for revision one.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureProfileWrite"
            examples:
              standard:
                $ref: "#/components/examples/CaptureProfileWrite"
      responses:
        "201":
          $ref: "#/components/responses/CaptureProfileMutationCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture-profiles/{profileID}:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      operationId: getCaptureProfile
      summary: Get a capture profile
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The capture profile was returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProfile"
              examples:
                draft:
                  $ref: "#/components/examples/CaptureProfileSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture-profiles/{profileID}/draft:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    put:
      operationId: updateCaptureProfileDraft
      summary: Replace the current mutable draft
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        description: The replacement name and complete document for the current mutable draft.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureProfileWrite"
            examples:
              standard:
                $ref: "#/components/examples/CaptureProfileWrite"
      responses:
        "200":
          $ref: "#/components/responses/CaptureProfileMutationOK"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/capture-profiles/{profileID}/validate:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: validateCaptureProfileDraft
      summary: Validate the current draft for publication
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The draft passed the publication gate.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProfileValidation"
              examples:
                valid:
                  $ref: "#/components/examples/CaptureProfileValidation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/capture-profiles/{profileID}/publish:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: publishCaptureProfileDraft
      summary: Publish the current draft
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/CaptureProfileMutationOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture-profiles/{profileID}/supersede:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: supersedeCaptureProfile
      summary: Create a superseding draft
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The complete document for the new draft revision.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureProfileSupersede"
            examples:
              standard:
                value:
                  document:
                    schema_version: 1
                    registry:
                      schema_version: 1
                      revision: 1
                      digest: sha256:71ef9df77044f9bf5eeb7ae448da3d98811ff4cb3f2541f459e60b4628a5364f
                    requirements:
                      - key: selfie
                        purpose: idenqa.purpose.identity_verification
                        evidence_type: idenqa.evidence.selfie_image
                        artefacts: [idenqa.artefact.selfie_image]
                        acquisition:
                          strategy: any_of
                          methods: [idenqa.method.file_upload]
                        required_assurances: []
                        constraints: []
                        fallbacks: []
      responses:
        "200":
          $ref: "#/components/responses/CaptureProfileMutationOK"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/capture-profiles/{profileID}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    post:
      operationId: deactivateCaptureProfile
      summary: Deactivate a capture profile
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/CaptureProfileMutationOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/capture-profiles/{profileID}/revisions/{revision}:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
      - $ref: "#/components/parameters/ProfileRevision"
    get:
      operationId: getCaptureProfileRevision
      summary: Get a capture-profile revision
      tags: [Capture profiles]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The numeric revision was returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureProfileRevision"
              examples:
                published:
                  $ref: "#/components/examples/CaptureProfileRevision"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications:
    post:
      operationId: createVerification
      summary: Create a verification session
      description: |
        Creates a collecting verification from the active published revision of
        the selected capture profile. The response includes a session-bound
        display-once capture bearer token and a purpose-separated, read-only
        outcome bearer token. Exact idempotent replay reconstructs the same
        tokens without storing either bearer value.
      tags: [Verifications]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The active capture profile and optional bounded session lifetimes.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCreate"
            example:
              capture_profile_id: prf_01M11HEQG00000000000000000
              policy_id: pol_01M11HEQG00000000000000000
              verification_ttl_seconds: 86400
              capture_token_ttl_seconds: 1800
              outcome_token_post_expiry_ttl_seconds: 86400
      responses:
        "201":
          description: The verification session and its initial capture and outcome tokens were created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCreated"
              example:
                session:
                  id: ver_01M11HEQG00000000000000000
                  state: collecting
                  version: 1
                  profile_id: prf_01M11HEQG00000000000000000
                  profile_revision: 1
                  profile_digest: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
                  policy_id: pol_01M11HEQG00000000000000000
                  region: ng-1
                  requirements:
                    schema_version: 1
                    registry:
                      schema_version: 1
                      revision: 1
                      digest: sha256:71ef9df77044f9bf5eeb7ae448da3d98811ff4cb3f2541f459e60b4628a5364f
                    requirements: []
                  created_at: "2026-08-27T12:00:00Z"
                  updated_at: "2026-08-27T12:00:00Z"
                  expires_at: "2026-08-28T12:00:00Z"
                capture_token: idq_cap_v1.1.eyJ0b2tlbl9pZCI6ImN0a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
                outcome_token: idq_out_v1.1.eyJ0b2tlbl9pZCI6Im90a18wMU0xMUhFUUcwMDAwMDAwMDAwMDAwMDAwMCJ9.c2lnbmF0dXJl
                outcome_token_expires_at: "2026-08-29T12:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/verifications/{verificationID}:
    parameters:
      - $ref: "#/components/parameters/VerificationID"
    get:
      operationId: getVerification
      summary: Get a verification session
      tags: [Verifications]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The tenant-owned verification session was returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSession"
              example:
                id: ver_01M11HEQG00000000000000000
                state: collecting
                version: 1
                profile_id: prf_01M11HEQG00000000000000000
                profile_revision: 1
                profile_digest: sha256:284a4418399974a7d1ce691f96ea534e1cd97ee1a9bc0d09de25d4a3b9d48969
                policy_id: pol_01M11HEQG00000000000000000
                region: ng-1
                requirements:
                  schema_version: 1
                  registry:
                    schema_version: 1
                    revision: 1
                    digest: sha256:71ef9df77044f9bf5eeb7ae448da3d98811ff4cb3f2541f459e60b4628a5364f
                  requirements: []
                created_at: "2026-08-27T12:00:00Z"
                updated_at: "2026-08-27T12:00:00Z"
                expires_at: "2026-08-28T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/verifications/{verificationID}/cancel:
    post:
      operationId: cancelVerification
      summary: Cancel a verification as the tenant
      description: |
        Requires verification_sessions:cancel. Cancels only the exact active version before its deadline.
        Requires the expected version and a reusable idempotency key. The original
        receipt is replayed for the same tenant, principal, key and input. Different
        input conflicts. Terminal sessions or elapsed deadlines reject fresh cancellation.
        Cancellation does not withdraw processing authority or delete retained evidence.
      tags: [Verifications]
      security:
        - TenantAPIKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/VerificationID"
      requestBody:
        description: Expected current session version for this cancellation command.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCancel"
      responses:
        "200":
          description: The original committed cancellation receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCancellation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/capture/cancel:
    post:
      operationId: cancelCaptureVerification
      summary: Cancel a verification as the subject
      description: |
        Cancels only the verification bound to this unexpired, unrevoked capture credential, including during processing. This route alone permits authenticated receipt replay after cancellation.
        Requires the expected version and a reusable idempotency key. The original
        receipt is replayed for the same tenant, principal, key and input. Different
        input conflicts. Terminal sessions or elapsed deadlines reject fresh cancellation.
        Cancellation does not withdraw processing authority or delete retained evidence.
      tags: [Capture]
      security:
        - CaptureToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: "Expected current session version for this cancellation command. Applies to cancel a verification as the subject."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCancel"
      responses:
        "200":
          description: "The original committed cancellation receipt. Applies to cancel a verification as the subject."
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCancellation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/verifications/{verificationID}/decision:
    parameters:
      - $ref: "#/components/parameters/VerificationID"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getLatestDecision
      summary: Get the latest decision for a verification
      description: Returns the safely reproduced current leaf of the tenant-owned immutable decision lineage.
      tags: [Decisions]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The latest decision was reproduced and returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionReport"
              examples:
                reproduced:
                  $ref: "#/components/examples/PolicyDecisionReport"
        "304":
          description: The current decision digest matches If-None-Match; no body is returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/decisions/{decisionID}:
    parameters:
      - $ref: "#/components/parameters/DecisionID"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getDecision
      summary: Get an exact immutable decision
      description: Returns a safe reproduction report without fact details, reason codes, or canonical payloads.
      tags: [Decisions]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The exact decision was reproduced and returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionReport"
              examples:
                reproduced:
                  $ref: "#/components/examples/PolicyDecisionReport"
        "304":
          description: The immutable decision digest matches If-None-Match; no body is returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/decisions/{decisionID}/bundle:
    parameters:
      - $ref: "#/components/parameters/DecisionID"
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: exportDecisionBundle
      summary: Export an exact portable decision bundle
      description: |
        Requires the separate decisions:export permission. The byte-exact
        canonical bundle contains immutable fact and provenance references but
        never raw evidence bytes. Its embedded digest is self-checking, not a
        digital signature or an external trust anchor.
      tags: [Decisions]
      security:
        - TenantAPIKey: []
      responses:
        "200":
          description: The byte-exact canonical decision bundle was returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/vnd.idenqa.decision-bundle.v1+json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionBundle"
        "304":
          description: The immutable bundle digest matches If-None-Match; no body is returned.
