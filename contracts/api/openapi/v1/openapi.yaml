        collected_at:
          type: string
          format: date-time
          pattern: Z$
        observed_at:
          type: string
          format: date-time
          pattern: Z$
        valid_from:
          type: string
          format: date-time
          pattern: Z$
        valid_until:
          type: string
          format: date-time
          pattern: Z$
        fresh_until:
          type: string
          format: date-time
          pattern: Z$
        retain_until:
          type: string
          format: date-time
          pattern: Z$
        confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        unit:
          type: string
          maxLength: 128
          minLength: 3
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        identifier:
          $ref: "#/components/schemas/IdentityIdentifier"
        id:
