    PolicyRevisionDiff:
      type: object
      description:
        Deterministic bounded structural difference between two immutable revisions of one policy.
        schema_major, schema_minor, policy_id, revision, and digests are reported on identity
        fields and never repeated inside changes.
      additionalProperties: false
      required:
        - schema_major
        - schema_minor
        - policy_id
        - from
        - to
        - identical
        - truncated
        - change_count
        - changes
        - digest
      properties:
        schema_major:
          type: integer
          const: 1
        schema_minor:
          type: integer
          const: 0
        policy_id:
          $ref: "#/components/schemas/PolicyID"
        from:
          $ref: "#/components/schemas/PolicyRevisionDiffSide"
        to:
          $ref: "#/components/schemas/PolicyRevisionDiffSide"
        identical:
          type: boolean
          description: True when both revisions carry the same canonical meaning.
        truncated:
          type: boolean
          description: True when change_count exceeds the exposed bounded change list.
        change_count:
          type: integer
          minimum: 0
          description: Total structural changes, including changes beyond the exposed list.
        changes:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/PolicyRevisionDiffChange"
        digest:
          $ref: "#/components/schemas/PolicyDigest"
      example:
        schema_major: 1
        schema_minor: 0
        policy_id: pol_01M11HEQG00000000000000000
        from:
          revision: 1
          digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        to:
          revision: 2
          digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        identical: false
        truncated: false
        change_count: 1
        changes:
          - path: /verified_assurance
            kind: changed
            old: synthetic.first
            new: synthetic.second
        digest: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    PolicyRevisionDiffSide:
      type: object
