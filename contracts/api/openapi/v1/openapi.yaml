        enabled: true
        region: primary
        window_seconds: 3600
        retention_seconds: 86400
        minimum_session_seconds: 0
        maximum_session_seconds: 3600
        thresholds: {}
        sources: []
        mappings: []
      additionalProperties: false
      required:
        - enabled
        - region
        - window_seconds
        - retention_seconds
        - minimum_session_seconds
        - maximum_session_seconds
        - thresholds
        - sources
        - mappings
      properties:
        enabled:
          type: boolean
        region: *id001
        window_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        retention_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        minimum_session_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        maximum_session_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        thresholds:
          type: object
          additionalProperties: false
          required: []
          properties:
            device_reuse:
              type: integer
              minimum: 1
              maximum: 10000
            identifier_reuse:
              type: integer
              minimum: 1
              maximum: 10000
            document_reuse:
              type: integer
              minimum: 1
              maximum: 10000
            portrait_reuse:
              type: integer
              minimum: 1
              maximum: 10000
            capture_replay:
              type: integer
              minimum: 1
              maximum: 10000
            verification_velocity:
              type: integer
              minimum: 1
              maximum: 10000
            network_anomaly:
              type: integer
              minimum: 1
              maximum: 10000
            provider_inconsistency:
              type: integer
              minimum: 1
              maximum: 10000
            identity_inconsistency:
              type: integer
              minimum: 1
              maximum: 10000
            session_timing:
              type: integer
              minimum: 1
              maximum: 10000
            failed_liveness:
              type: integer
              minimum: 1
              maximum: 10000
            high_risk_model:
              type: integer
              minimum: 1
              maximum: 10000
        sources:
          type: array
          items:
            $ref: "#/components/schemas/FraudSource"
          maxItems: 64
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/FraudMapping"
          maxItems: 64
    FraudConfigurationRequest:
      type: object
      description: Activate a fraud rule revision under an expected current version.
      example:
        expected_version: 1
        configuration:
          enabled: true
          region: primary
          window_seconds: 3600
          retention_seconds: 86400
          minimum_session_seconds: 0
          maximum_session_seconds: 3600
          thresholds: {}
          sources: []
          mappings: []
      additionalProperties: false
      required:
        - expected_version
        - configuration
      properties:
        expected_version:
          type: integer
          minimum: 0
          maximum: 9223372036854775806
          example: 1
        configuration:
          $ref: "#/components/schemas/FraudConfiguration"
    FraudInput:
      type: object
      description: Evidence-backed tenant tokens submitted for the pinned verification.
      example:
        verification_id: ver_01M11HEQG00000000000000000
        evidence_id: evd_01M11HEQG00000000000000000
        namespace: primary
        source_reference: source-1
        attributes:
          - kind: device
            value: token-1
      additionalProperties: false
      required:
        - verification_id
        - evidence_id
        - namespace
        - source_reference
        - attributes
      properties:
        verification_id:
          $ref: "#/components/schemas/VerificationSessionID"
        evidence_id:
          $ref: "#/components/schemas/EvidenceID"
        namespace: *id001
        source_reference: *id001
        attributes:
          type: array
          items:
            type: object
