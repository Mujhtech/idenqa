    post:
      operationId: runPolicyRegression
      summary: Run a bounded portable policy scenario suite
      description:
        Requires policies:read. Side-effect-free deterministic evaluation of one portable
        `PolicyRegressionSuite` document holding at most the documented scenario maximum. Every
        scenario is a closed `PolicySimulationInput` with an exact canonical expectation; execution
        failures reject the request while expectation mismatches are reported as data with
        passed=false. No production facts are read and no policy is registered, activated, decided,
        tasked, or audited.
