      example:
        number: 1
        secret_version: 1
        status_code: 503
        error_class: http_retryable
        retry_after_ms: 1000
        response_body: '{"error":"temporarily unavailable"}'
        response_truncated: false
        completed_at: "2026-09-06T00:00:00Z"
