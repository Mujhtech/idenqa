        schema_major:
          type: integer
          minimum: 1
          maximum: 65535
        schema_minor:
          type: integer
          minimum: 0
          maximum: 65535
        digest:
          $ref: "#/components/schemas/PolicyDigest"
    PolicyCanonicalEvaluator:
      type: object
      description: Exact evaluator contract and implementation identity.
      additionalProperties: false
      required: [major, minor, digest]
      properties:
        major:
          type: integer
          minimum: 1
          maximum: 65535
        minor:
          type: integer
          minimum: 0
          maximum: 65535
        digest:
          $ref: "#/components/schemas/PolicyDigest"
    PolicyCanonicalFact:
      type: object
      description: Bounded policy fact with immutable provenance references and no raw evidence.
      additionalProperties: false
      required: [key, state, source, observed_at, reason_codes]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        state:
          $ref: "#/components/schemas/PolicyRequirementState"
        source:
          $ref: "#/components/schemas/PolicyCanonicalFactSource"
        observed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Exclusive ticket expiry in UTC.
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-z][a-z0-9._:-]*$
    PolicyCanonicalFactSource:
      type: object
      description: Closed source-reference union; the kind selects the valid provenance
        fields.
      additionalProperties: false
      required:
        - kind
      allOf:
        - if:
            properties:
              kind:
                const: check
            required:
              - kind
          then:
            type: object
            required:
              - check_id
              - check_version
              - attempt_id
              - observation_ids
              - contract_digest
              - implementation_digest
            not:
              anyOf:
                - required:
                    - authority_id
                - required:
                    - acknowledgement_id
                - required:
                    - review_finding
        - if:
            properties:
              kind:
                const: processing_authority
            required:
              - kind
          then:
            type: object
            required:
              - authority_id
            not:
              anyOf:
                - required:
                    - check_id
                - required:
                    - check_version
                - required:
                    - attempt_id
                - required:
                    - observation_ids
                - required:
                    - contract_digest
                - required:
                    - implementation_digest
                - required:
                    - acknowledgement_id
                - required:
                    - review_finding
        - if:
            properties:
              kind:
                const: subject_response
            required:
              - kind
          then:
            type: object
            required:
              - acknowledgement_id
            not:
              anyOf:
                - required:
                    - check_id
                - required:
                    - check_version
                - required:
                    - attempt_id
                - required:
                    - observation_ids
                - required:
                    - contract_digest
                - required:
                    - implementation_digest
                - required:
                    - authority_id
                - required:
                    - review_finding
        - if:
            properties:
              kind:
                const: review_finding
            required:
              - kind
          then:
            type: object
            required:
              - review_finding
            not:
              anyOf:
                - required:
                    - check_id
                - required:
                    - check_version
                - required:
                    - attempt_id
                - required:
                    - observation_ids
                - required:
                    - contract_digest
                - required:
                    - implementation_digest
                - required:
                    - authority_id
                - required:
                    - acknowledgement_id
        - if:
            type: object
            properties:
              kind:
                type: string
                const: fraud
            required:
              - kind
          then:
            type: object
            required:
              - fraud_receipt
            not:
              type: object
              anyOf:
                - required:
                    - check_id
                - required:
                    - check_version
                - required:
                    - attempt_id
                - required:
                    - observation_ids
                - required:
                    - contract_digest
                - required:
                    - implementation_digest
                - required:
                    - authority_id
                - required:
                    - acknowledgement_id
                - required:
                    - review_finding
        - if:
            type: object
            properties:
              kind:
                type: string
                not:
                  const: fraud
            required:
              - kind
          then:
            type: object
            not:
              type: object
              required:
                - fraud_receipt
        - if:
            type: object
            properties:
              kind:
                type: string
                const: identity
            required:
              - kind
          then:
            type: object
            required:
              - identity_receipt
            not:
              type: object
              anyOf:
                - required:
                    - check_id
                - required:
                    - check_version
                - required:
                    - attempt_id
                - required:
                    - observation_ids
                - required:
                    - contract_digest
                - required:
                    - implementation_digest
                - required:
                    - authority_id
                - required:
                    - acknowledgement_id
                - required:
                    - review_finding
                - required:
                    - fraud_receipt
        - if:
            type: object
            properties:
              kind:
                type: string
                not:
                  const: identity
            required:
              - kind
          then:
            type: object
            not:
              type: object
              required:
                - identity_receipt
      properties:
        kind:
          $ref: "#/components/schemas/PolicyFactSourceKind"
        check_id:
          $ref: "#/components/schemas/PolicyCheckID"
        check_version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        attempt_id:
          $ref: "#/components/schemas/PolicyAttemptID"
        observation_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicyObservationID"
        contract_digest:
          $ref: "#/components/schemas/PolicyDigest"
        implementation_digest:
          $ref: "#/components/schemas/PolicyDigest"
        authority_id:
          $ref: "#/components/schemas/ProcessingAuthorityID"
        acknowledgement_id:
          $ref: "#/components/schemas/SubjectResponseID"
        review_finding:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._:-]*$
        fraud_receipt:
          $ref: "#/components/schemas/PolicyDigest"
        identity_receipt:
          $ref: "#/components/schemas/PolicyDigest"
    PolicyCanonicalEvaluation:
