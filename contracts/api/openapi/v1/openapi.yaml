        - PRECONDITION_FAILED
        - REQUEST_TOO_LARGE
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - REQUEST_CANCELLED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - REQUEST_TIMEOUT
