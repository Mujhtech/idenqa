        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/experiences/{experienceID}/rollback:
    parameters:
      - name: experienceID
        in: path
        required: true
        description: Stable portable-experience identifier.
        schema: { $ref: '#/components/schemas/ExperienceID' }
    post:
      operationId: rollbackExperience
      summary: Roll back to a prior immutable revision
      description: Requires experiences:publish. Republishes one previously approved immutable revision without editing it. The rollback target must have been approved; the replaced live revision is marked superseded. Repeating the same rollback is idempotent.
      tags: [Experiences]
      security: [TenantAPIKey: []]
      x-required-scopes: [experiences:publish]
      requestBody:
        required: true
        description: Optimistic precondition, rollback target version, and optional reason.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExperienceRollback' }
            example: { expected_version: 4, target_version: 1, reason: Restore prior approved revision }
      responses:
        '200':
          description: The prior revision is live again.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' }, ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experience' }
              example: { id: exp_01J00000000000000000000000, state: published, revision: 3, latest_version: 2, approved_version: 2, published_version: 2, document: { schema_version: '1.0', experience_id: exp_01J00000000000000000000000, version: 1, name: Acme selfie capture, copy: { version: tc_acme_v1, locales: [{ locale: en, entries: [{ key: capture.title, value: Verify your identity }] }] }, mandatory_copy_version: mc-2026-09-01, default_locale: en, targeting: [{ workflow: capture.identity, countries: [NG] }], links: { support: https://acme.example/support, privacy: https://acme.example/privacy, terms: https://acme.example/terms }, theme: { primary_color: '#1f6feb', accent_color: '#0b3d91', background_color: '#ffffff', text_color: '#1b1f23' } }, created_at: '2026-09-20T12:00:00Z', updated_at: '2026-09-20T12:05:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/experiences/{experienceID}/export:
    parameters:
      - name: experienceID
        in: path
        required: true
        description: Stable portable-experience identifier.
        schema: { $ref: '#/components/schemas/ExperienceID' }
    get:
      operationId: exportExperience
      summary: Export one signed experience manifest
      description: Requires experiences:read. Returns the signed canonical manifest of the live published revision, or the latest revision when nothing is published, so another Core installation can import it without Console or Cloud.
      tags: [Experiences]
