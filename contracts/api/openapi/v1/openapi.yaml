                        directive:
                          const: complete_inconclusive
                      required:
                        - directive
                    then:
                      properties:
                        state:
                          enum:
                            - inconclusive
                            - unavailable
                properties:
                  state:
                    enum:
                      - satisfied
                      - not_satisfied
                      - inconclusive
                      - unavailable
                      - prohibited
                  directive:
                    enum:
                      - complete_verified
