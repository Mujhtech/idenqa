components:
  securitySchemes:
    TenantAPIKey:
      type: http
      scheme: bearer
      bearerFormat: idq_v1
      description: A display-once tenant API key supplied only in Authorization.
    CaptureToken:
      type: http
      scheme: bearer
      bearerFormat: idq_cap_v1
      description: A session-bound capture token supplied only in Authorization.
    OutcomeToken:
      type: http
      scheme: bearer
      bearerFormat: idq_out_v1
      description: A session-bound read-only outcome token supplied only in Authorization.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum collection items to return. The default is 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        An RFC 9651 String used to deduplicate a consequential request. It is
        scoped to the authenticated tenant and operation. Reusing a key with a
        different canonical request fingerprint is a conflict. Keys are not
        credentials and clients must not place secrets or identity data in them.
      schema:
        type: string
        minLength: 3
        maxLength: 130
      example: '"vs_01M11HEQG00000000000000000"'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong entity tag most recently returned for the resource.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Strong opaque ETag returned by a previous decision response.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
    ProfileID:
      name: profileID
      in: path
      required: true
      description: Stable capture-profile identifier.
      schema:
        $ref: "#/components/schemas/CaptureProfileID"
    ProfileRevision:
      name: revision
      in: path
      required: true
      description: Positive immutable profile revision number.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    VerificationID:
      name: verificationID
      in: path
      required: true
      description: Stable verification-session identifier.
      schema:
        $ref: "#/components/schemas/VerificationSessionID"
    DecisionID:
      name: decisionID
      in: path
      required: true
      description: Stable immutable policy-decision identifier.
      schema:
        $ref: "#/components/schemas/PolicyDecisionID"
    UploadID:
      name: uploadID
      in: path
      required: true
      description: Opaque requirement-bound evidence-upload identifier.
      schema:
        $ref: "#/components/schemas/EvidenceUploadID"
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: Canonical RFC 9530 SHA-256 digest of the complete plaintext body.
      schema:
        type: string
        pattern: "^sha-256=:[A-Za-z0-9+/]{43}=:$"
      example: "sha-256=:K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=:"
    NoticeID:
      name: noticeID
      in: path
      required: true
      description: Immutable notice-version identifier.
      schema:
        $ref: "#/components/schemas/NoticeVersionID"
    ModelName:
      name: modelName
      in: path
      required: true
      description: Tenant-owned evaluation-model registry name.
      schema:
        $ref: "#/components/schemas/ModelRegistryName"
    ProviderID:
      name: providerID
      in: path
      required: true
      description: Tenant-owned provider registration identifier.
      schema:
        $ref: "#/components/schemas/ProviderID"
  headers:
    XRequestID:
      description: Server-issued request identifier. Caller-supplied values are ignored.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
    ETag:
      description: Strong entity tag for conditional access to this representation.
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: '"1"'
    RateLimit:
      description: Current request quota and reset information as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "limit=100, remaining=99, reset=60"
    RateLimitPolicy:
      description: Applied quota policy as an HTTP Structured Field.
      required: false
      schema:
        type: string
      example: "100;w=60"
    RetryAfter:
      description: Delay in seconds before retrying the request.
      required: false
      schema:
        type: integer
        minimum: 1
    Deprecation:
      description: Deprecation instant encoded as an RFC 9745 Structured Field Date.
      required: false
      schema:
        type: string
      example: "@1798761600"
    Sunset:
      description: Expected retirement time encoded as an RFC 8594 HTTP date.
      required: false
      schema:
        type: string
      example: Thu, 01 Jul 2027 00:00:00 GMT
    Link:
      description: Links to deprecation or successor documentation when applicable.
      required: false
      schema:
        type: string
    WWWAuthenticate:
      description: Minimal Bearer authentication challenge.
      required: true
      schema:
        type: string
      example: Bearer realm="idenqa"
  schemas:
    AssuranceDimension:
      type: string
      description: Independent platform assurance dimension; there is no universal ranking.
      enum:
      - identity_resolution
      - evidence_validation
      - applicant_binding
      - source_independence
      - fraud_resistance
      - human_oversight
      - provenance
      - freshness
      - liveness
      - integrity
      example: liveness
    AssuranceCapabilityName:
      type: string
      description: Platform capability meaning; declarations do not prove successful execution.
      enum:
      - idenqa.assurance.authority_record
      - idenqa.assurance.document_authenticity
      - idenqa.assurance.capture_quality
      - idenqa.assurance.face_match_1to1
      - idenqa.assurance.passive_liveness
      - idenqa.assurance.active_liveness
      - idenqa.assurance.freshness
      - idenqa.assurance.live_capture
      - idenqa.assurance.capture_integrity
      - idenqa.assurance.human_review
      - idenqa.assurance.identity_corroboration
      - idenqa.assurance.fraud_controls
      example: idenqa.assurance.active_liveness
    AssuranceRunnerKind:
      type: string
      description: The owned boundary that produced the recorded source.
      enum:
      - provider
      - model
      - capture
      - review
      - identity
      - fraud
      example: provider
    AssuranceSelection:
      type: object
      description: Exact immutable tenant assurance profile reference.
      additionalProperties: false
      required:
      - name
      - revision
      - digest
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: capture.example
        revision:
          example: 1
          type: integer
          minimum: 1
          maximum: 4294967295
        digest:
          $ref: '#/components/schemas/PolicyDigest'
      example:
        name: capture.example
        revision: 1
        digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    AssuranceRequirement:
      type: object
      description: All dimensions must be met independently. Capabilities are alternatives within this requirement; shared transitive roots count once. Property is a
        descriptive tenant label, not a scalar rank.
      additionalProperties: false
      required:
      - dimension
      - property
      - minimum_sources
      - maximum_age_seconds
      - capabilities
      properties:
        dimension:
          $ref: '#/components/schemas/AssuranceDimension'
        property:
          type: string
          minLength: 1
          maxLength: 64
        minimum_sources:
          type: integer
          minimum: 1
          maximum: 32
        maximum_age_seconds:
          type: integer
          minimum: 1
          maximum: 31536000
        capabilities:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/AssuranceCapabilityName'
      example:
        dimension: freshness
        property: session_capture
        minimum_sources: 1
        maximum_age_seconds: 120
        capabilities:
        - idenqa.assurance.freshness
    AssuranceMapping:
      type: object
      description: Exact capability-to-runner mapping checked against the platform catalog. Model thresholds require the pinned registry selection; evaluation-only execution
        never qualifies.
      additionalProperties: false
      required:
      - capability
      - signal
      - runner_kind
      - runner_id
      - package_digest
      - configuration_digest
      properties:
        capability:
          $ref: '#/components/schemas/AssuranceCapabilityName'
        signal:
          type: string
          minLength: 1
          maxLength: 100
        runner_kind:
          $ref: '#/components/schemas/AssuranceRunnerKind'
        runner_id:
          type: string
          minLength: 1
          maxLength: 128
        package_digest:
          $ref: '#/components/schemas/PolicyDigest'
        configuration_digest:
          $ref: '#/components/schemas/PolicyDigest'
        threshold_digest:
          $ref: '#/components/schemas/PolicyDigest'
      example:
        capability: idenqa.assurance.freshness
        signal: capture.freshness
        runner_kind: capture
        runner_id: idenqa.method.live_camera
        package_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        configuration_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    AssuranceProfile:
      type: object
      description: Immutable tenant profile. No production threshold or jurisdiction certification is supplied by default.
      additionalProperties: false
      required:
      - name
      - revision
      - requirements
      - mappings
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: capture.example
        revision:
          type: integer
          minimum: 1
          maximum: 4294967295
        requirements:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/AssuranceRequirement'
        mappings:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/AssuranceMapping'
      example:
        name: capture.example
        revision: 1
        requirements:
        - dimension: freshness
          property: session_capture
          minimum_sources: 1
          maximum_age_seconds: 120
          capabilities:
          - idenqa.assurance.freshness
        mappings:
        - capability: idenqa.assurance.freshness
          signal: capture.freshness
          runner_kind: capture
          runner_id: idenqa.method.live_camera
          package_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          configuration_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    AssuranceAssignmentRequest:
      type: object
      description: Version-checked selection for future sessions; null disables assignment for future sessions. Existing sessions keep their immutable pin.
      additionalProperties: false
      required:
      - expected_version
      - selection
      properties:
        expected_version:
          type: integer
          minimum: 0
          maximum: 9223372036854775806
          example: 0
        selection:
          anyOf:
          - $ref: '#/components/schemas/AssuranceSelection'
          - type: 'null'
      example:
        expected_version: 0
        selection:
          name: capture.example
          revision: 1
          digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    AssuranceResource:
      type: object
      description: Tenant-scoped profile, assignment, or discovery page. An absent selection means no typed assurance requested. Follow next_cursor while present.
      additionalProperties: false
      required: []
      properties:
        profile:
          $ref: '#/components/schemas/AssuranceProfile'
        digest:
          $ref: '#/components/schemas/PolicyDigest'
        profiles:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/AssuranceSelection'
        selection:
          $ref: '#/components/schemas/AssuranceSelection'
        version:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        next_cursor:
          type: string
          minLength: 1
          maxLength: 80
      example:
        profile:
          name: capture.example
          revision: 1
          requirements:
          - dimension: freshness
            property: session_capture
            minimum_sources: 1
            maximum_age_seconds: 120
            capabilities:
            - idenqa.assurance.freshness
          mappings:
          - capability: idenqa.assurance.freshness
            signal: capture.freshness
            runner_kind: capture
            runner_id: idenqa.method.live_camera
            package_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            configuration_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    AssuranceCapability:
      type: object
      description: Platform-owned allowed signal meanings. Capture assurances are proved by accepted acquisition provenance, never SDK advertisements.
      additionalProperties: false
      required:
      - name
      - dimensions
      - signals
      - runner_kinds
      properties:
        name:
          $ref: '#/components/schemas/AssuranceCapabilityName'
        dimensions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/AssuranceDimension'
        signals:
          type: array
          minItems: 0
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 100
        signal_prefix:
          type: string
          minLength: 1
          maxLength: 100
        runner_kinds:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/AssuranceRunnerKind'
        required_capture_assurances:
          type: array
          minItems: 0
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 100
      example:
        name: idenqa.assurance.freshness
        dimensions:
