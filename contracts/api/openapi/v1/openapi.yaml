      summary: Evaluate one portable synthetic policy simulation
      description:
        Requires policies:read. Side-effect-free deterministic evaluation of one portable
        `PolicySimulationInput` document. The embedded policy uses the same closed `PolicyDocument`
        meaning accepted by revision creation, normalised to canonical form, but is never registered,
        activated, decided, tasked, or audited. Supplied facts use the canonical
        `PolicyCanonicalFact` shape without evidence bytes. No production facts are read and no
        expression source is returned. The request body is bounded by the portable simulation input
        limit.
