        - TenantAPIKey: []
      parameters:
        - name: event_types
          in: query
          required: false
          description: Comma-separated catalogue event names, or * for all catalogue events.
          schema:
            type: string
            minLength: 1
            maxLength: 8192
        - name: Last-Event-ID
          in: header
          required: false
          description: The last delivered event sequence; the stream resumes after it.
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        "200":
          description: A live text/event-stream feed of canonical catalogue envelopes.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames with id, event and data fields; comments are heartbeats.
