<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf3f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1311" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"
    />
    <title>Identity Verification</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #edf3f1;
      }

      body {
        margin: 0;
        min-width: 20rem;
      }

      main {
        padding: clamp(0rem, 4vw, 2.5rem);
      }

      .demo-note {
        color: #52605c;
        font-size: 0.8125rem;
        margin: 1rem auto 0;
        max-width: 42rem;
        text-align: center;
      }

      .visually-hidden {
        block-size: 1px;
        clip-path: inset(50%);
        inline-size: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0c1311;
        }

        .demo-note {
          color: #aab9b4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Identity Verification</h1>
      <idenqa-capture></idenqa-capture>
      <p id="hosted-error" class="demo-note" role="alert" hidden>
        This local demo is not configured. Check the Capture Web README and try again.
      </p>
      <p class="demo-note">Local self-hosted demonstration using synthetic evidence.</p>
    </main>
    <script type="module" src="/hosted.ts"></script>
  </body>
</html>
