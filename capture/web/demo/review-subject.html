<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf3f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1311" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'"
    />
    <title>Identity Capture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #edf3f1;
        color: #17201d;
      }

      body {
        margin: 0;
        min-width: 20rem;
      }

      .subject-context {
        background: #ffffff;
        border-bottom: 1px solid #d7dfdc;
        padding: 1rem clamp(1rem, 5vw, 3rem);
      }

      .subject-context h1 {
        font-size: 1rem;
        margin: 0 0 0.25rem;
      }

      .subject-context p {
        color: #5c6965;
        font-size: 0.875rem;
        margin: 0;
      }

      main {
        padding: clamp(0rem, 4vw, 2.5rem);
      }

      #subject-status {
        color: #5c6965;
        display: block;
        font-size: 0.8125rem;
        margin: 1rem auto;
        max-width: 42rem;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0c1311;
          color: #f0f6f3;
        }

        .subject-context {
          background: #131c19;
          border-color: #314039;
        }

        .subject-context p,
        #subject-status {
          color: #aab9b4;
        }
      }
    </style>
  </head>
  <body>
    <header class="subject-context">
      <h1 id="subject-title">Complete Your Identity Check</h1>
      <p id="subject-copy">The organisation reviewing your account needs this capture.</p>
    </header>
    <main>
      <idenqa-capture></idenqa-capture>
      <output id="subject-status" aria-live="polite">Preparing secure capture…</output>
    </main>
    <script type="module" src="/review-subject.ts"></script>
  </body>
</html>
